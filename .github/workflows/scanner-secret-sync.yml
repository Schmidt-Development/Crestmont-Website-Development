name: Scanner secret sync (staging only)

# Synchronises the staging Worker's FILE_SCANNER_SECRET to the Founder-provided value and repairs the fingerprint
# bookkeeping that goes with it, so the Node 1 scanner and staging hold the same credential.
#
# Why this exists. The scanner was refused with 401 "Signature mismatch", and the live Worker refuses the key the
# repository token derives as well, while staging D1 still records a fingerprint that disagrees with that token. The
# consequence is the part that matters: putSecretIfChanged compares a value against its own record and never asks the
# Worker, so once the two diverge it reports "unchanged" for ever and NO staging deploy will re-put the secret. Eight
# consecutive deploys did exactly that. Nothing on Node 1 can fix it, and no token anyone holds reproduces what the
# Worker is holding, so the Worker has to be given a value we control.
#
# Setting FILE_SCANNER_SECRET as a staging-environment GitHub secret is what makes this stable: it takes precedence
# over the derivation (deploy-staging.yml), so later deploys put the same value instead of re-deriving. Production
# never reads this secret (deploy-production.yml and release.yml do not reference it) and an environment-scoped secret
# cannot reach it in any case.
#
# Staging only, and it deploys no code: a Worker secret write plus one D1 row. It refuses to run without a provided
# secret, because putting the derived value is what already fails. It then PROVES its own effect by signing a request
# with that value and failing the job if the Worker still refuses.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type SYNC to write the staging Worker secret
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'SYNC'
    # Job-level, after `if:` (CREST-NEW-007): GitHub keeps ONE pending run per concurrency group, so a run
    # that never starts a job still holds the slot. At workflow level it did exactly that here -- the synthetic
    # failed `push` run GitHub creates for an unparseable workflow took the slot and a dispatched run sat
    # `pending` behind it for fifteen minutes. A skipped job never enters the group.
    concurrency:
      group: deploy-staging   # a secret write creates a new Worker version
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER: npx --yes wrangler@4.149.0
      STAGING_URL: ${{ vars.STAGING_URL || 'https://crestmont-platform-staging.partners-df4.workers.dev' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"

      - name: Refuse without a Founder-provided secret
        env:
          SCANNER_SECRET: ${{ secrets.FILE_SCANNER_SECRET }}
        run: |
          if [ -z "$SCANNER_SECRET" ]; then
            echo "::error::No FILE_SCANNER_SECRET is set for the staging environment. Putting the derived value is what already fails, so there is nothing to synchronise to."
            exit 1
          fi
          case "$SCANNER_SECRET" in
            *[!0-9a-f]* | "") echo "::error::FILE_SCANNER_SECRET must be lower-case hex."; exit 1;;
          esac
          echo "A provided secret is present (value not shown)."

      - name: Resolve the staging D1 database id (same injection as deploy-staging.yml, CREST-GAP-065)
        run: |
          id=$($WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).find(d=>d.name==="crestmont-staging");process.stdout.write(r?r.uuid:"")})')
          [ -n "$id" ] || { echo "::error::The crestmont-staging D1 database was not found."; exit 1; }
          node -e 'const fs=require("fs");let t=fs.readFileSync("wrangler.toml","utf8");t=t.replace(/(database_name = "crestmont-staging", database_id = )""/, `$1"${process.argv[1]}"`);fs.writeFileSync("wrangler.toml",t)' "$id"
          grep -q "$id" wrangler.toml && echo "Staging D1: $id"

      - name: Put it on the staging Worker and repair the fingerprint (approved mechanism)
        env:
          SCANNER_SECRET: ${{ secrets.FILE_SCANNER_SECRET }}
        run: printf '%s' "$SCANNER_SECRET" | node --no-warnings scripts/staging-secrets.ts put FILE_SCANNER_SECRET

      - name: Prove the Worker now accepts a signed scanner request
        env:
          FILE_SCANNER_SECRET: ${{ secrets.FILE_SCANNER_SECRET }}
        run: node --no-warnings scripts/scanner-secret-check.ts --probe-provided "$STAGING_URL"
