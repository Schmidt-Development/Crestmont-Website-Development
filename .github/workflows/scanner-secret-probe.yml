name: Scanner secret probe (read-only)

# Which credential does the DEPLOYED staging Worker expect for FILE_SCANNER_SECRET?
#
# The Node 1 scanner is refused with 401 "Signature mismatch". That error is reachable only after the signature header
# parses and its timestamp passes the window, and both sides HMAC exactly `${t}.${body}` with no path, method, headers
# or canonicalisation involved, so the only possible cause is that the two copies of the secret differ. Staging's copy
# is derived from the CLOUDFLARE_API_TOKEN of the environment the deploy ran in -- a secret that exists only here, so
# only a job in this environment can test it. That is the whole reason this workflow exists.
#
# It is READ-ONLY on every surface it touches:
#   · /api/scan/queue is a SELECT (scanQueue -> filesAwaitingScan). The probe signs one and reads the status.
#   · the D1 read is a single SELECT against deploy_secret_fingerprints.
#   · no secret is put, rotated or deployed, and no Worker code is published.
#
# It prints no secret. The derived key is masked, and the two checksums it prints are a truncated SHA-256 under a fixed
# public label -- one-way, and bounded so the Founder can compare a candidate token locally (--offline) and tell whether
# it is this one, without either value being disclosed to anyone.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: scanner-secret-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'   # main only, like every workflow that holds staging secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging                  # resolves CLOUDFLARE_API_TOKEN exactly as deploy-staging.yml's deploy job does
    env:
      WRANGLER: npx --yes wrangler@4.149.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
      - name: Resolve the staging D1 database id (same injection as deploy-staging.yml, CREST-GAP-065)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$($WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).find(d=>d.name==="crestmont-staging");process.stdout.write(r?r.uuid:"")})')
          [ -n "$id" ] || { echo "::error::The crestmont-staging D1 database was not found."; exit 1; }
          node -e 'const fs=require("fs");let t=fs.readFileSync("wrangler.toml","utf8");t=t.replace(/(database_name = "crestmont-staging", database_id = )""/, `$1"${process.argv[1]}"`);fs.writeFileSync("wrangler.toml",t)' "$id"
          grep -q "$id" wrangler.toml && echo "Staging D1: $id"

      - name: Does staging accept the key the deploy installs? (live Worker + one D1 SELECT, read-only)
        env:
          # The same expressions deploy-staging.yml uses, so this job tests what that job puts: the staging-environment
          # FILE_SCANNER_SECRET when it is set (it takes precedence, scanner-secret-sync.yml), otherwise the key the
          # Cloudflare token derives.
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FILE_SCANNER_SECRET: ${{ secrets.FILE_SCANNER_SECRET }}
          STAGING_URL: ${{ vars.STAGING_URL || 'https://crestmont-platform-staging.partners-df4.workers.dev' }}
        run: |
          if [ -n "$FILE_SCANNER_SECRET" ]; then
            echo "A staging FILE_SCANNER_SECRET is set: the deploy installs it, so that is the value to test."
            node --no-warnings scripts/scanner-secret-check.ts --probe-provided "$STAGING_URL"
          else
            node --no-warnings scripts/scanner-secret-check.ts --probe "$STAGING_URL"
          fi
