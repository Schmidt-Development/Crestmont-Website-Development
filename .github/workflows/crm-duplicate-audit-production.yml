name: CRM duplicate audit (production, read-only)
# PR #50 / docs/crm-identity/RUNBOOK.md §4. Classifies historical duplicates in the production CRM WITHOUT changing it:
# scripts/crm-duplicate-audit.ts --remote sends only SELECT statements (checked before sending; no export, so the
# database is never paused) and prints counts by class only. Nothing is uploaded, no record values are printed (the
# repository is public). Runs in the `production` environment, so it waits for the Founder's approval like every
# production job. Manual only.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crm-duplicate-audit-production
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"   # >= 22.18 for native TypeScript
      - name: Read-only duplicate audit (counts only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          out=$(node --no-warnings scripts/crm-duplicate-audit.ts --remote crestmont-production --env production)
          echo "::notice title=CRM duplicate audit (production, read-only)::$out"
          { echo "### CRM duplicate audit — production (read-only)"; echo; echo '```json'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
