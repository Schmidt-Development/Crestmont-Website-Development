name: Portfolio demo isolation audit (read-only)

# Reads — never changes — the Cloudflare Git build settings of the project repositories (Workers Builds triggers and
# Pages projects) and reports whether pushing each portfolio-demo branch would start any build of those projects'
# own Workers or Pages (production or shared staging). It deploys nothing, writes no settings and prints no secrets.
# The demo branches are pushed only after this audit reports ISOLATED (docs/frontend/PORTFOLIO.md).

on:
  push:
    branches: [main]
    paths:
      - scripts/demo-isolation-audit.ts
      - scripts/demo-isolation-rules.ts
      - .github/workflows/portfolio-demo-isolation-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-demo-isolation-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
      - name: Audit Cloudflare Git build settings for the demo branches (read-only)
        env:
          # A separate READ-ONLY token (Account › Workers CI › Read, Account › Cloudflare Pages › Read, Account › Workers
          # Scripts › Read) so the deploy token never needs broader access. Falls back to the deploy token, which cannot
          # read these settings — the audit then reports UNVERIFIED rather than assuming isolation.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional, read-only use: lets the audit read the Netlify site's branch-deploy settings (otherwise UNVERIFIED
          # for the repository that Netlify builds).
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node --no-warnings scripts/demo-isolation-audit.ts
