name: Staging health monitor

# On-demand staging health check (READY-012, INFRA-006). Formerly the scheduled external alerting for staging; its
# schedule was retired on 2026-11-07 (see `on:` below). Runs from GitHub's infrastructure, outside Cloudflare. The scheduled
# probe reads only public health endpoints; the optional manual backup job run uses a key derived from the Cloudflare
# token secret.
# A failed run is the alert — GitHub notifies the account that last changed this schedule (and repository watchers
# subscribed to Actions) by email/web notification. The Founder may later add or swap a channel (see docs/RUNBOOK.md,
# "Alerting"); this workflow stays as the zero-cost baseline.
#
# Schedule reality (measured 2026-11-05, SEC-07): the cron asks for every 30 minutes — 48 runs a day — and GitHub
# delivers about 4. Over the 190 hours from 2026-10-28 to 2026-11-05 it recorded 34 scheduled runs: median gap 356
# minutes, longest 624, and not one gap under 60. GitHub documents scheduled workflows as best effort and drops runs
# under load, so this is a detection LATENCY of up to about ten hours, not the half hour the cron reads like.
# Reproduce with:
#   gh api "repos/<owner>/<repo>/actions/workflows/<this file>/runs?per_page=100" --paginate \
#     --jq '.workflow_runs[] | select(.event=="schedule") | .created_at'
# Detection itself is proven: runs 18-26 failed continuously through the 2026-10-31 to 11-02 outage of
# /api/readiness/health. The in-Worker ops_alerts job checks the same failing feeds every 15 minutes and emails the
# Owners, which would make this latency irrelevant — but it sends through Resend, so it delivers nothing until
# BLK-005 is closed. Until then a failed run here is the only alert that reaches a person.
on:
  # RETIRED as a recurring monitor (Founder decision 2026-11-07): staging is temporary and is removed once production
  # and the Artifact Builder are promoted, so a continuously healthy staging is not a production launch requirement and
  # no release workflow or readiness gate depends on this workflow. It stays as an on-demand diagnostic (and the manual
  # backup job runner below). Production keeps its own scheduled monitor: production-health-monitor.yml.
  workflow_dispatch:
    inputs:
      run_jobs:
        description: "Also run the scheduled jobs through the signed backup endpoint (only if native Cron Triggers fail)"
        type: boolean
        default: false
      include_daily:
        description: "With run_jobs: include the daily job set"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-health-monitor
  cancel-in-progress: true

jobs:
  probe:
    if: github.ref == 'refs/heads/main'   # main only (see deploy-staging.yml)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: staging
    env:
      BASE: ${{ vars.STAGING_URL || 'https://crestmont-platform-staging.partners-df4.workers.dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
      - name: Manual job run (backup scheduler, on demand only)
        # Native Cron Triggers run the scheduled jobs (Workers Paid, verified 2026-10-28). This step only runs when a
        # person starts the workflow with run_jobs=true, e.g. while native triggers are being repaired.
        if: github.event_name == 'workflow_dispatch' && inputs.run_jobs
        env:
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INCLUDE_DAILY: ${{ inputs.include_daily }}
        run: |
          daily=""; [ "$INCLUDE_DAILY" = "true" ] && daily="--daily"
          node --no-warnings scripts/trigger-scheduler.ts run --url "$BASE" $daily | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Service and evidence-feed health (retries before alerting)
        run: |
          fail=""
          for attempt in 1 2 3; do
            fail=""
            app=$(curl -s -o /tmp/app.json -w '%{http_code}' --max-time 20 "$BASE/api/health" || echo 000)
            feeds=$(curl -s -o /tmp/feeds.json -w '%{http_code}' --max-time 20 "$BASE/api/readiness/health" || echo 000)
            [ "$app" = "200" ] || fail="$fail /api/health=$app"
            [ "$feeds" = "200" ] || fail="$fail /api/readiness/health=$feeds"
            [ -z "$fail" ] && break
            sleep 60
          done
          {
            echo "### Staging health $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "- /api/health: $app"
            echo "- /api/readiness/health: $feeds"
            echo '```json'; cat /tmp/feeds.json 2>/dev/null | head -c 4000; echo; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$fail" ]; then echo "::error title=Staging unhealthy::$fail (after 3 attempts)"; exit 1; fi
