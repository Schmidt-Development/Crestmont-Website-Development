name: Diagnostic — real websites through the shared remote browser (temporary)
# TEMPORARY: development server + the runner's Chromium against the real websites (no production session, no
# production browser-minutes). Not part of the product; removed before the pull request.
on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/diag-real-sites.mjs", "scripts/portfolio-perf.mjs", ".github/workflows/diag-first-frames.yml"]
permissions:
  contents: read
jobs:
  real-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw/browsers
      PLAYWRIGHT_MODULE: ${{ github.workspace }}/.pw/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
      - run: |
          npm install --prefix .pw --no-save --no-audit --no-fund --ignore-scripts playwright@1.48.2 > /dev/null
          .pw/node_modules/.bin/playwright install --with-deps chromium > /dev/null
      - name: Development server (remote browser on the runner's Chromium, real websites)
        run: |
          mkdir -p .dev diag-out
          CHROMIUM="$(node -e 'import(process.argv[1]).then((m) => console.log(m.chromium.executablePath()))' "$PLAYWRIGHT_MODULE")"
          REMOTE_BROWSER=on REMOTE_BROWSER_CHROMIUM="$CHROMIUM" REMOTE_BROWSER_MAX_CONCURRENT=3 REMOTE_BROWSER_IDLE_SECONDS=60 REMOTE_BROWSER_RATE_PER_10MIN=500 \
            node --no-warnings dev/server.ts --port 8787 --db .dev/real.db > "$RUNNER_TEMP/dev.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://localhost:8787/api/health && break; sleep 1; done
      - name: Content on screen when each website turns live
        run: node --no-warnings scripts/diag-real-sites.mjs http://localhost:8787 .dev/real.db https://geteveryinvoicepaid.com/ https://premiuminvoices.com/ https://lendingforbeginners.com/ | tee real.log
      - name: Performance (fast and 5 Mbit/s links) — Get Every Invoice Paid and Premium Invoices
        run: |
          node --no-warnings scripts/portfolio-perf.mjs http://localhost:8787 --slug real-geteveryinvoicepaid --devices desktop --out diag-out/perf-geip.json --label "runner GEIP" 2>&1 | tail -12
      - name: Development server log (tail)
        if: always()
        run: tail -40 "$RUNNER_TEMP/dev.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-sites
          path: diag-out
