name: CodeQL

# Code scanning is free for public repositories; on a private repository it requires GitHub Code Security.
# The repository is public (2026-10-28), so this also runs on every push to main and every pull request.
# If the repository is made private without Code Security, upload fails here only; CI is unaffected.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
