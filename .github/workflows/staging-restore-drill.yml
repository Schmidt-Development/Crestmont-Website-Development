name: Staging restore drill

# TEST-004 / INFRA-006: proves the staging database can be restored. Exports staging D1, restores the export into a
# throw-away D1 database, compares every table's row count, records signed staging evidence, then deletes the scratch
# database. Staging itself is only read (export) — the drill never writes to it. Production is never touched.

on:
  workflow_dispatch:
  # After every successful staging deploy, so recovery is re-proven against the build that is actually serving.
  workflow_run:
    workflows: ["Deploy staging"]
    types: [completed]
  schedule:
    - cron: "41 7 * * 1"   # weekly, Monday 07:41 UTC

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    # main only: a manual run from another branch would execute that branch's (possibly older) copy of this file.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    environment: staging
    # Job-level, after `if:` (CREST-NEW-007): GitHub keeps ONE pending run per concurrency group. At workflow level,
    # the run this workflow_run creates for a CANCELLED or failed deploy took that slot and cancelled the next pending
    # Deploy staging (run 41148168046 for 1a2e97e) before skipping itself. A skipped job never enters the group.
    concurrency:
      group: deploy-staging   # shares the group: its evidence step installs a Worker secret, which creates a new Worker version
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.149.0
      SCRATCH: crestmont-restore-drill-${{ github.run_id }}
    steps:
      - name: Check Cloudflare credentials
        id: pre
        env:
          HAS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS" != "true" ]; then echo "::notice title=Restore drill skipped::Cloudflare secrets are not configured."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.pre.outputs.ok == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.pre.outputs.ok == 'true'
        with:
          node-version: "22.x"
      # CREST-GAP-065: wrangler.toml leaves the staging database_id empty (the id is not committed). Inject the real id into
      # the workspace copy exactly as deploy-staging.yml does, so `--env staging` commands bind the right database by id
      # instead of relying on name resolution. Lookup only: this workflow never creates the staging database.
      - name: Resolve the staging D1 database id (same injection as deploy-staging.yml)
        if: steps.pre.outputs.ok == 'true'
        run: |
          id=$($WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).find(d=>d.name==="crestmont-staging");process.stdout.write(r?r.uuid:"")})')
          [ -n "$id" ] || { echo "::error::The crestmont-staging D1 database was not found (deploy-staging.yml creates it)."; exit 1; }
          # Inject the id into the staging block only (workspace copy; nothing is committed).
          node -e 'const fs=require("fs");let t=fs.readFileSync("wrangler.toml","utf8");t=t.replace(/(database_name = "crestmont-staging", database_id = )""/, `$1"${process.argv[1]}"`);fs.writeFileSync("wrangler.toml",t)' "$id"
          grep -q "$id" wrangler.toml && echo "Staging D1: $id"
      - name: Export staging (read-only)
        id: export
        if: steps.pre.outputs.ok == 'true'
        run: |
          echo "STARTED=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"
          mkdir -p drill evidence
          fail() { echo "reason=$1: $(cat drill/err.log drill/out.log 2>/dev/null | sed -e 's/\x1b\[[0-9;]*m//g' | grep -iE 'error|code' | head -3 | tr '\n' ' ' | sed -E 's#/accounts/[^/]+/#/accounts/…/#' | cut -c1-300)" >> "$GITHUB_OUTPUT"; exit 1; }
          count() { i=0; files=""; while IFS= read -r q; do [ -n "$q" ] || continue
              $WRANGLER d1 execute "$1" $2 --json --command "$q" > "drill/$3-$i.json" 2> drill/err.log || { cp "drill/$3-$i.json" drill/out.log; return 1; }
              files="$files${files:+,}drill/$3-$i.json"; i=$((i+1)); done < drill/count.sql; echo "$files" > "drill/$3.list"; }
          $WRANGLER d1 export crestmont-staging --remote --env staging --output drill/staging.sql > /dev/null 2> drill/err.log || fail "export"
          $WRANGLER d1 execute crestmont-staging --remote --env staging --json --command "SELECT name FROM sqlite_master WHERE type='table'" > drill/tables.json 2> drill/err.log || fail "list tables"
          node --no-warnings scripts/restore-drill.ts sql drill/tables.json > drill/count.sql
          count crestmont-staging "--remote --env staging" source || fail "count source rows"
      - name: Restore into a scratch database and compare
        id: restore
        if: steps.pre.outputs.ok == 'true' && steps.export.outcome == 'success'
        run: |
          fail() { echo "reason=$1: $(cat drill/err.log drill/out.log 2>/dev/null | sed -e 's/\x1b\[[0-9;]*m//g' | grep -iE 'error|code' | head -3 | tr '\n' ' ' | sed -E 's#/accounts/[^/]+/#/accounts/…/#' | cut -c1-300)" >> "$GITHUB_OUTPUT"; exit 1; }
          count() { i=0; files=""; while IFS= read -r q; do [ -n "$q" ] || continue
              $WRANGLER d1 execute "$1" $2 --json --command "$q" > "drill/$3-$i.json" 2> drill/err.log || { cp "drill/$3-$i.json" drill/out.log; return 1; }
              files="$files${files:+,}drill/$3-$i.json"; i=$((i+1)); done < drill/count.sql; echo "$files" > "drill/$3.list"; }
          $WRANGLER d1 create "$SCRATCH" > /dev/null 2> drill/err.log || fail "create scratch database"
          node --no-warnings scripts/restore-drill.ts sanitize drill/staging.sql drill/import.sql
          $WRANGLER d1 execute "$SCRATCH" --remote --file drill/import.sql --yes > drill/out.log 2> drill/err.log || fail "import export into scratch"
          count "$SCRATCH" "--remote" restored || fail "count restored rows"
          node --no-warnings scripts/restore-drill.ts compare "$(cat drill/source.list)" "$(cat drill/restored.list)" \
            --commit "$GITHUB_SHA" --run-id "gh-${{ github.run_id }}-${{ github.run_attempt }}-restore-drill" --started "$STARTED" --out evidence/restore-drill.json
      - name: Record evidence on staging
        if: always() && steps.pre.outputs.ok == 'true'
        env:
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FAIL_REASON: ${{ steps.export.outputs.reason || steps.restore.outputs.reason }}   # via env, never interpolated
          EVIDENCE_INGEST_SECRET_STABLE: ${{ secrets.EVIDENCE_INGEST_SECRET }}
        run: |
          mkdir -p evidence
          [ -f evidence/restore-drill.json ] || node --no-warnings scripts/restore-drill.ts fail --reason "${FAIL_REASON:-drill stopped before the comparison}" \
            --commit "$GITHUB_SHA" --run-id "gh-${{ github.run_id }}-${{ github.run_attempt }}-restore-drill" --started "${STARTED:-$(date -u +%Y-%m-%dT%H:%M:%S.000Z)}" --out evidence/restore-drill.json
          # The staging preview URL (repository variable STAGING_URL overrides the known workers.dev address).
          url="${{ vars.STAGING_URL || 'https://crestmont-platform-staging.partners-df4.workers.dev' }}"
          # The same value deploy-staging.yml installed (GitHub secret, else the derived key); never put or rotated here,
          # because a secret change would block rollbacks.
          ev=$(node --no-warnings scripts/evidence-secret.ts print)
          echo "::add-mask::$ev"
          READINESS_URL="$url" EVIDENCE_INGEST_SECRET="$ev" node --no-warnings scripts/post-evidence.ts evidence/restore-drill.json
      - name: Delete the scratch database
        if: always() && steps.pre.outputs.ok == 'true'
        run: $WRANGLER d1 delete "$SCRATCH" --skip-confirmation > /dev/null 2>&1 || $WRANGLER d1 delete "$SCRATCH" -y > /dev/null 2>&1 || echo "::warning::Scratch database $SCRATCH could not be deleted automatically; delete it in the Cloudflare dashboard."
      - name: Remove the local export
        if: always()
        run: rm -rf drill
