name: Diagnostic — which rentals build is live (temporary, read-only)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/diag-framing.yml"]
permissions:
  contents: read
jobs:
  rentals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          html=$(curl -s --max-time 20 https://lansingcarrentals.com/)
          echo "brand__name present: $(echo "$html" | grep -c 'brand__name')"
          echo "asset versions: $(echo "$html" | grep -o '?v=[0-9]*' | sort -u | tr '\n' ' ')"
          echo "scripts: $(echo "$html" | grep -o '<script src="[^"]*"' | tr '\n' ' ')"
          curl -s -o /dev/null -w "portfolio-frame.js: %{http_code} %{content_type}\n" https://lansingcarrentals.com/js/portfolio-frame.js
          curl -s -D - -o /dev/null https://lansingcarrentals.com/ | tr -d '\r' | grep -iE '^(server|cf-ray|x-served-by|via|x-nf-request-id|age|date):' | cut -d: -f1 | tr '\n' ' '
