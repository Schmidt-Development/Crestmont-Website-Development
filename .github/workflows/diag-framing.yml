name: Diagnostic — live framing headers after the site releases (temporary, read-only)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/diag-framing.yml"]
permissions:
  contents: read
jobs:
  headers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Live response headers (GET, no cookies; nothing submitted)
        run: |
          WANT="frame-ancestors https://crestmontwebsitedevelopment.com https://www.crestmontwebsitedevelopment.com"
          fa() { curl -s -o /dev/null -D - --max-time 20 -H 'cache-control: no-cache' "$1" | tr -d '\r' | grep -i '^content-security-policy:' | grep -o "frame-ancestors[^;]*" | head -1; }
          probe() {
            out=$(curl -s -o /dev/null -D - --max-time 20 -H 'cache-control: no-cache' "$1" | tr -d '\r')
            code=$(echo "$out" | head -1 | awk '{print $2}')
            xfo=$(echo "$out" | grep -i '^x-frame-options:' | head -1 | cut -d' ' -f2-)
            f=$(echo "$out" | grep -i '^content-security-policy:' | grep -o "frame-ancestors[^;]*" | tr '\n' '|')
            echo "$code | $1 | XFO=${xfo:-—} | ${f:-no frame-ancestors}"
          }
          for site in https://geteveryinvoicepaid.com https://glasslyautoglass.com https://betterlansingmechanics.com https://mentorship.lansingcarrentals.com; do
            for i in $(seq 1 40); do [ "$(fa "$site/")" = "$WANT" ] && break; sleep 15; done
            echo "### $site (public page settled after ~$(( (i-1) * 15 )) s)"
          done
          echo "### GEIP";    for p in / /developers /security /support /privacy /terms /login /signup /forgot-password /app /owner /api/health /p/x; do probe "https://geteveryinvoicepaid.com$p"; done
          echo "### Glassly"; for p in / /quote /q/abc /ops /api/health; do probe "https://glasslyautoglass.com$p"; done; probe "https://quotes.glasslyautoglass.com/quote"
          echo "### BLM";     for p in / /services /about /es /book /login /portal /owner /manage-booking /api/public/slots; do probe "https://betterlansingmechanics.com$p"; done
          echo "### Mentorship"; for p in / /book /booking/confirmed /owner /healthz /api/availability; do probe "https://mentorship.lansingcarrentals.com$p"; done
          echo "### Rentals (changes in Crestmont's release)"; for p in / /privacy /partner/apply /owner/login; do probe "https://lansingcarrentals.com$p"; done
          echo "### Lead Haven (reference)"; for p in / /account/ /privacy/; do probe "https://leadhavencollective.com$p"; done
