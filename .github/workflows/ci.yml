name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"   # >= 22.18 for native TypeScript
      - name: Install dev tooling
        run: npm install --no-save typescript@5 @types/node@22
      - name: Typecheck
        run: npx tsc -p tsconfig.json
      - name: Unit / integration tests (emits requirement evidence)
        run: npm test
      - name: Build runner (AI Builds) — typecheck and mock tests
        run: npx tsc -p runner/tsconfig.json && node --no-warnings --test 'runner/test/*.test.ts'
      - name: Lead-research worker — typecheck, unit and worker↔platform integration tests
        run: npx tsc -p research-worker/tsconfig.json && node --no-warnings --test 'research-worker/test/*.test.ts'
      # ASVS F-10. The previous step (`npm audit ... || true` at the root) could never fail: the root has no
      # lockfile, so npm audit exited with ENOLOCK and the error was swallowed. This audits every committed
      # lockfile that actually lists packages and fails on high/critical advisories. A package.json that declares
      # dependencies without a committed lockfile is reported as a warning (the runner-images job generates those).
      - name: Dependency audit (npm audit on every committed lockfile; blocking on high)
        run: |
          set -euo pipefail
          audited=0
          for pj in $(git ls-files '*package.json' | grep -v node_modules); do
            dir=$(dirname "$pj")
            if [ -f "$dir/package-lock.json" ] && node -e 'const l=require(process.argv[1]);process.exit(Object.keys(l.packages||{}).filter(k=>k).length?0:1)' "$PWD/$dir/package-lock.json"; then
              echo "::group::npm audit $dir"; (cd "$dir" && npm audit --audit-level=high --omit=optional); echo "::endgroup::"; audited=$((audited+1))
            elif node -e 'const p=require(process.argv[1]);process.exit(Object.keys({...p.dependencies,...p.devDependencies,...p.optionalDependencies}).length?0:1)' "$PWD/$pj"; then
              echo "::warning file=$pj::$dir declares dependencies but has no committed lockfile with packages; it was not audited."
            fi
          done
          echo "Audited $audited lockfile(s)." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-evidence
          path: evidence/ci-evidence.json
          retention-days: 14
      - name: Post evidence to staging readiness API
        if: always() && github.ref == 'refs/heads/main' && vars.READINESS_URL != ''
        env:
          READINESS_URL: ${{ vars.READINESS_URL }}
          EVIDENCE_INGEST_SECRET: ${{ secrets.EVIDENCE_INGEST_SECRET }}
        run: npm run evidence:post

  # AI Builds runner: real image builds on every push (nothing is pushed anywhere), plus self-checks inside the built
  # images. This is the build evidence the Windows host cannot provide until it exists; it does not run a model.
  runner-images:
    name: Runner images (build + self-checks, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
      - name: hadolint (pinned release binary, checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64
          echo "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" runner/Dockerfile runner/sandbox/Dockerfile runner/windows/proxy/Dockerfile
      - name: Sandbox lockfile is committed (required); optional paid adapter lockfile generated if missing (warning)
        run: |
          set -e
          if [ ! -f runner/sandbox/package-lock.json ]; then
            echo "::error file=runner/sandbox/package.json::runner/sandbox/package-lock.json must be committed (the sandbox image installs with npm ci from it)."
            exit 1
          fi
          if [ ! -f runner/agent-sdk/package-lock.json ]; then
            echo "::warning file=runner/agent-sdk/package.json::runner/agent-sdk/package-lock.json (optional paid adapter) is not committed."
            (cd runner/agent-sdk && npm install --package-lock-only --ignore-scripts --no-audit --no-fund) || echo "::warning::could not resolve runner/agent-sdk dependencies"
          fi
      - name: Upload lockfiles for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-lockfiles
          if-no-files-found: ignore
          path: |
            runner/package-lock.json
            runner/sandbox/package-lock.json
            runner/agent-sdk/package-lock.json
      - name: Build runner image (default local provider, no paid SDK)
        run: docker buildx build --load --progress=plain -t crestmont-ai-runner:ci -f runner/Dockerfile runner
      - name: Build per-build sandbox image
        run: docker buildx build --load --progress=plain -t crestmont-build-sandbox:ci -f runner/sandbox/Dockerfile runner/sandbox
      - name: Build egress proxy image
        run: docker buildx build --load --progress=plain -t crestmont-egress-proxy:ci runner/windows/proxy
      - name: Sandbox self-checks (production docker flags; uid 10001; no network; Chromium offline)
        run: node --no-warnings runner/ci/sandbox-self-check.ts crestmont-build-sandbox:ci
      - name: Runner and proxy self-checks (squid -k parse on the rendered allow-list)
        run: node --no-warnings runner/ci/runner-image-self-check.ts crestmont-ai-runner:ci crestmont-egress-proxy:ci
      - name: Egress allow-list end to end (compose networks, real proxy image, fake model server, tripwire)
        run: node --no-warnings runner/ci/egress-e2e.ts crestmont-ai-runner:ci crestmont-egress-proxy:ci
      - name: Base image digests (pinned references must still resolve; current digest of each tag reported)
        if: always()
        run: |
          set -u
          echo "### Base images (tag -> current digest of that tag)" >> "$GITHUB_STEP_SUMMARY"
          { grep -ho '^ARG [A-Z_]*_IMAGE=[^ ]*' runner/Dockerfile runner/sandbox/Dockerfile runner/windows/proxy/Dockerfile | cut -d= -f2
            grep -ho '\[string\]\$OllamaImage = "[^"]*"' runner/windows/Install-CrestmontRunner.ps1 | cut -d'"' -f2; } | sort -u |
            while read -r ref; do
              tag="${ref%%@*}"
              digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)
              pinned=""; case "$ref" in *@sha256:*) pinned="${ref##*@}";; esac
              state="unpinned"
              if [ -n "$pinned" ]; then
                if [ "$pinned" = "$digest" ]; then state="pinned, current"; else state="pinned, the tag has moved since (review before re-pinning)"; fi
              fi
              echo "- \`$tag\` -> \`${digest:-unresolved}\` ($state)" >> "$GITHUB_STEP_SUMMARY"
              # Annotation: readable through the checks API (the step summary is not), for reviewing digest pins.
              echo "::notice title=Base image digest::$tag@${digest:-unresolved} ($state)"
            done

  # Windows deployment scripts: real PowerShell parse + PSScriptAnalyzer (pwsh is preinstalled on GitHub's ubuntu
  # images), and the installer's squid.conf renderer compared byte for byte with the tested TypeScript renderer.
  windows-scripts:
    name: Windows scripts (pwsh parse, PSScriptAnalyzer, renderer parity)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
      - name: Parse every script and run PSScriptAnalyzer (Windows PowerShell 5.1 compatibility rules)
        shell: pwsh
        run: ./runner/windows/Test-WindowsScripts.ps1 -InstallAnalyzer
      - name: SquidConf.ps1 renders exactly what egress-policy.ts renders
        run: node --no-warnings --test --test-name-pattern "SquidConf.ps1" runner/test/egress-compose.test.ts
      - name: RunnerEnv.ps1 (runner.env / runner.local.env preservation) produces exactly what runner-env.ts produces
        run: |
          set -o pipefail
          if ! node --no-warnings --test --test-name-pattern "RunnerEnv.ps1" runner/test/runner-env.test.ts > "$RUNNER_TEMP/runnerenv.txt" 2>&1; then
            cat "$RUNNER_TEMP/runnerenv.txt"
            # One annotation with the failing test's details (readable through the checks API, unlike the job log).
            msg=$(sed -n '/^not ok/,/^  \.\.\.$/p' "$RUNNER_TEMP/runnerenv.txt" | head -120 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=RunnerEnv.ps1 parity::$msg"
            exit 1
          fi
          cat "$RUNNER_TEMP/runnerenv.txt"
