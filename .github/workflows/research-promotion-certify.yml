name: Research CRM import rate certification (staging)

# Measures the research → CRM import rate on STAGING and certifies it against the per-minute target, reading the
# CRM's own rows rather than the promoter's counters (scripts/research-promotion-certify.ts).
#
# It is read-only: it promotes nothing itself and changes no setting. The imports it measures are the ones the
# one-minute Cron Trigger is making on its own, which is the only thing worth certifying — a rate produced by a
# script standing over the database would prove nothing about the system running unattended.
#
# `observe_minutes` lets the run wait before measuring, so a window can be certified end to end in one go: the job
# waits, then reads the window that just elapsed. The default measures the hour that has already passed.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Window to certify, in minutes (counted backwards from when the measurement runs)"
        type: string
        default: "60"
      observe_minutes:
        description: "Wait this many minutes before measuring, so the window is one that elapsed during this run"
        type: string
        default: "0"
      target:
        description: "New CRM leads per minute required"
        type: string
        default: "25"

permissions:
  contents: read

concurrency:
  group: research-promotion-certify
  cancel-in-progress: false

jobs:
  certify:
    if: github.ref == 'refs/heads/main'   # main only, like the other staging-facing workflows
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
      # Dispatch inputs reach the script through the environment as quoted shell variables and are never interpolated
      # into the script text (SEC-007 / F-23): a `${{ inputs.* }}` inside `run:` would let a dispatcher run arbitrary
      # commands on a runner holding the Cloudflare token. The script validates the values again itself.
      - name: Certify the import rate against staging D1 (read-only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          E2E_BASE_URL: https://crestmont-platform-staging.partners-df4.workers.dev
          MINUTES: ${{ inputs.minutes }}
          OBSERVE: ${{ inputs.observe_minutes }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Promotion certification::CLOUDFLARE_API_TOKEN is not set for the staging environment."
            exit 1
          fi
          case "${OBSERVE:-0}" in ''|*[!0-9]*) echo "::error::observe_minutes must be a whole number"; exit 1;; esac
          if [ "${OBSERVE:-0}" -gt 0 ]; then
            if [ "${OBSERVE}" -gt 180 ]; then echo "::error::observe_minutes is capped at 180"; exit 1; fi
            echo "Letting the one-minute Cron Trigger work for ${OBSERVE} minutes, then measuring that window."
            sleep $(( OBSERVE * 60 ))
          fi
          node --no-warnings scripts/research-promotion-certify.ts \
            --minutes "${MINUTES:-60}" --target "${TARGET:-25}" --out evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: research-promotion-certification
          path: |
            evidence/research-promotion-certification.json
            evidence/research-promotion-certification.md
          retention-days: 90
          if-no-files-found: warn
