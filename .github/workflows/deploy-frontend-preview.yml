name: Deploy frontend preview

# Independent preview of the frontend branch (docs/frontend/HANDOFF.md §Preview). Deploys the Worker
# "crestmont-platform-frontend-preview" with its OWN disposable D1 database "crestmont-frontend-preview".
# It never deploys, migrates, seeds or sets secrets on crestmont-platform-staging or production:
#   • every wrangler command passes --env frontend-preview and the guard step refuses any other target;
#   • scripts/staging-access.ts is NOT used (it is hard-wired to --env staging);
#   • the deployed URL must contain "crestmont-platform-frontend-preview" or the run fails.
# Prerequisites: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID available to the "frontend-preview" GitHub
# environment (repository-level secrets also work). Without them the run is skipped with a notice.
#
# Access (the repository is PUBLIC — workflow artifacts and logs are readable by anyone signed in to GitHub):
#   • No credential is ever uploaded as an artifact (plain or encrypted) or written to the log.
#   • FRONTEND_PREVIEW_PASSWORD (secret set by the Founder, ≥ 12 characters) is the preview password.
#   • FRONTEND_PREVIEW_DEMO_PASSWORD (optional, ≥ 12) is the password of every demo account; if unset, the demo
#     accounts use FRONTEND_PREVIEW_PASSWORD. Staff demo accounts (Owner included) have no authenticator: two-factor
#     stays required and is enrolled by the Founder on first sign-in, so no 2FA key ever exists outside the preview.
#   • Without FRONTEND_PREVIEW_PASSWORD the preview is deployed LOCKED (random values nobody holds) and the run
#     summary says how to unlock it. Reset = change the secret, then re-run this workflow.
#   • Every run proves the path on the live preview: preview password → homepage → Owner sign-in → 2FA required.

on:
  push:
    branches: [claude/frontend-redesign]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-preview
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: frontend-preview
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        name: Check Cloudflare credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice title=Frontend preview skipped::Make CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID available to the frontend-preview environment (or as repository secrets). Nothing was deployed."
            echo "configured=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment:
      name: frontend-preview
      url: ${{ steps.deploy.outputs.url }}   # recorded on the GitHub deployment, so the exact URL is verifiable
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_ENV: frontend-preview
      PREVIEW_WORKER: crestmont-platform-frontend-preview
      PREVIEW_DB: crestmont-frontend-preview
      WRANGLER: npx --yes wrangler@4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dev tooling
        run: npm install --no-save typescript@5 @types/node@22

      - name: Typecheck and tests (the preview only receives code that passes)
        run: npx tsc -p tsconfig.json && npm test

      - name: Guard — targets must be the frontend preview only
        run: |
          node -e '
            const t = require("fs").readFileSync("wrangler.toml", "utf8");
            const s = t.indexOf("[env.frontend-preview]"); if (s < 0) throw new Error("no [env.frontend-preview] block");
            const e = t.indexOf("\n[env.", s + 1); const block = t.slice(s, e > 0 ? e : undefined);
            const name = /\nname = "([^"]+)"/.exec(block)?.[1], db = /database_name = "([^"]+)"/.exec(block)?.[1];
            if (name !== process.env.PREVIEW_WORKER) throw new Error(`worker name is ${name}`);
            if (db !== process.env.PREVIEW_DB) throw new Error(`database is ${db}`);
            if (/staging"|production"/.test(name + "\"") || /crestmont-(staging|production)/.test(db)) throw new Error("refusing a shared target");
            if (/r2_buckets/.test(block)) throw new Error("the preview must not bind an R2 bucket");
            console.log(`Guard ok: ${name} / ${db}`);'

      - name: Recreate the disposable preview database
        run: |
          list() { $WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).find(d=>d.name===process.env.PREVIEW_DB);process.stdout.write(r?r.uuid:"")})'; }
          old=$(list)
          if [ -n "$old" ]; then $WRANGLER d1 delete "$PREVIEW_DB" --skip-confirmation; fi
          $WRANGLER d1 create "$PREVIEW_DB"
          id=$(list); [ -n "$id" ] || { echo "::error::Could not create $PREVIEW_DB"; exit 1; }
          node -e 'const fs=require("fs");let t=fs.readFileSync("wrangler.toml","utf8");t=t.replace(/(database_name = "crestmont-frontend-preview", database_id = )""/, `$1"${process.argv[1]}"`);fs.writeFileSync("wrangler.toml",t)' "$id"
          grep -q "$id" wrangler.toml && echo "Preview D1: $id"

      - name: Apply D1 migrations (preview database only)
        run: $WRANGLER d1 migrations apply "$PREVIEW_DB" --remote --env "$PREVIEW_ENV"

      - name: Deploy the preview Worker
        id: deploy
        run: |
          $WRANGLER deploy --env "$PREVIEW_ENV" | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          case "$url" in *crestmont-platform-frontend-preview*) ;; *) echo "::error::Unexpected deploy URL '$url' — refusing to continue"; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Preview access from the Founder's secrets (nothing printed or uploaded)
        id: access
        env:
          FOUNDER_PREVIEW_PASSWORD: ${{ secrets.FRONTEND_PREVIEW_PASSWORD }}
          FOUNDER_DEMO_PASSWORD: ${{ secrets.FRONTEND_PREVIEW_DEMO_PASSWORD }}
        run: |
          mkdir -p access
          rnd() { node -e 'process.stdout.write(require("crypto").randomBytes(24).toString("base64url"))'; }
          if [ ${#FOUNDER_PREVIEW_PASSWORD} -ge 12 ]; then
            gate="$FOUNDER_PREVIEW_PASSWORD"; demo="${FOUNDER_DEMO_PASSWORD:-$FOUNDER_PREVIEW_PASSWORD}"
            if [ ${#demo} -lt 12 ]; then echo "::error title=FRONTEND_PREVIEW_DEMO_PASSWORD too short::Use at least 12 characters, or delete it to reuse FRONTEND_PREVIEW_PASSWORD."; exit 1; fi
            echo "mode=founder" >> "$GITHUB_OUTPUT"
            [ -n "$FOUNDER_DEMO_PASSWORD" ] && echo "demo=separate" >> "$GITHUB_OUTPUT" || echo "demo=same" >> "$GITHUB_OUTPUT"
          else
            # No usable Founder secret: lock the preview with random values that nobody holds.
            gate=$(rnd); demo=$(rnd)
            echo "mode=locked" >> "$GITHUB_OUTPUT"
            if [ -n "$FOUNDER_PREVIEW_PASSWORD" ]; then echo "::warning title=Frontend preview locked::FRONTEND_PREVIEW_PASSWORD is shorter than 12 characters. Set a longer value and re-run this workflow."
            else echo "::warning title=Frontend preview locked::Add the secret FRONTEND_PREVIEW_PASSWORD (Settings → Environments → frontend-preview, or a repository secret) and re-run this workflow."; fi
          fi
          echo "::add-mask::$gate"; echo "::add-mask::$demo"
          printf '%s' "$gate" | $WRANGLER secret put STAGING_ACCESS_PASSWORD --env "$PREVIEW_ENV" > /dev/null
          printf '%s' "$gate" > access/gate; printf '%s' "$demo" > access/demo

      - name: Seed labelled sample data and demo accounts (Founder's demo password; 2FA enrolled at first sign-in)
        run: |
          node --no-warnings scripts/seed-staging.ts --out seed.sql --credentials access/discarded-random-credentials.md > /dev/null
          rm -f access/discarded-random-credentials.md
          FRONTEND_PREVIEW_DEMO_PASSWORD="$(cat access/demo)" node --no-warnings scripts/frontend-preview-access.ts --out access/demo-access.sql
          $WRANGLER d1 execute "$PREVIEW_DB" --remote --env "$PREVIEW_ENV" --file seed.sql --yes > /dev/null
          $WRANGLER d1 execute "$PREVIEW_DB" --remote --env "$PREVIEW_ENV" --file access/demo-access.sql --yes > /dev/null
          rm -f access/demo-access.sql
          echo "Sample data and demo accounts seeded."

      - name: Smoke checks
        env:
          BASE: ${{ steps.deploy.outputs.url }}
        run: |
          for i in 1 2 3 4 5 6; do code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/health"); [ "$code" = "200" ] && break; sleep 5; done
          [ "$code" = "200" ] || { echo "::error::/api/health returned $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/"); [ "$code" = "401" ] || { echo "::error::preview gate not active on / (HTTP $code)"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/assets/app.css"); [ "$code" = "200" ] || { echo "::error::assets not served (HTTP $code)"; exit 1; }

      - name: Verify the preview serves this commit's frontend assets (byte-for-byte)
        env:
          BASE: ${{ steps.deploy.outputs.url }}
        run: |
          fail=0
          for f in assets/app.css assets/app.js assets/nojs.css assets/fonts/InterDisplay-Medium.woff assets/art/hero-build.webp assets/art/stage-build.webp; do
            want=$(sha256sum "public/$f" | cut -d' ' -f1)
            got=$(curl -s "$BASE/$f" | sha256sum | cut -d' ' -f1)
            if [ "$want" = "$got" ]; then echo "ok   $f $want"; else echo "::error::$f served $got, expected $want"; fail=1; fi
          done
          # Homepage markup through the preview gate (this run's own password; never printed)
          PW=$(cat access/gate)
          # The password was just written as a Worker secret; allow up to ~60 s for it to propagate.
          cookie=""
          for i in $(seq 1 12); do
            cookie=$(curl -s -D - -o /dev/null --data-urlencode "password=$PW" --data-urlencode "next=/" "$BASE/__preview-access" | grep -i '^set-cookie: cm_preview=' | sed -E 's/^set-cookie: ([^;]+);.*/\1/I' | tr -d '\r')
            [ -n "$cookie" ] && break
            sleep 5
          done
          [ -n "$cookie" ] || { echo "::error::preview password was not accepted"; exit 1; }
          home=$(curl -s -H "cookie: $cookie" "$BASE/")
          for marker in 'class="intro"' 'data-statement' 'data-stages' 'class="bento"' 'data-switch' 'hero-build.webp'; do
            if printf '%s' "$home" | grep -q "$marker"; then echo "ok   homepage contains $marker"; else echo "::error::homepage is missing $marker"; fail=1; fi
          done
          [ "$fail" = 0 ] && echo "Hosted preview serves the assets and homepage of ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
          exit $fail

      - name: Verify access works on the live preview (preview password → Owner sign-in → 2FA required)
        env:
          BASE: ${{ steps.deploy.outputs.url }}
        run: PREVIEW_PASSWORD="$(cat access/gate)" DEMO_PASSWORD="$(cat access/demo)" node --no-warnings scripts/frontend-preview-check.ts "$BASE"

      - name: Access summary (no credentials; nothing is uploaded)
        if: always() && steps.deploy.outcome == 'success'
        env:
          BASE: ${{ steps.deploy.outputs.url }}
          MODE: ${{ steps.access.outputs.mode }}
          DEMO: ${{ steps.access.outputs.demo }}
        run: |
          rm -rf access
          {
            if [ "$MODE" = "founder" ]; then
              echo "### Frontend preview ready: $BASE"
              echo
              echo "Commit \`${GITHUB_SHA}\`. Credentials are never uploaded or logged — this repository is public."
              echo
              echo "1. Open $BASE and enter **your \`FRONTEND_PREVIEW_PASSWORD\`** (the secret you set in GitHub)."
              if [ "$DEMO" = "separate" ]; then pwname="FRONTEND_PREVIEW_DEMO_PASSWORD"; else pwname="FRONTEND_PREVIEW_PASSWORD"; fi
              echo "2. Optional — dashboards: sign in at $BASE/login as \`owner@crestmont-preview.test\` with your \`$pwname\`."
              echo "   The first sign-in asks you to set up two-factor authentication: scan the code with your authenticator app."
              echo "   The preview database is recreated on every run, so remove the old authenticator entry and enrol again after each deploy."
              echo "3. Other demo accounts use the same password: \`customer.harbor@crestmont-preview.test\`, \`customer.ridgeline@crestmont-preview.test\` (customer portal), \`administrator@\`, \`sales@\`, \`support@\`, \`developer@crestmont-preview.test\` (staff; 2FA set up on first sign-in)."
              echo
              echo "**Reset or change the password:** update the secret, then run *Deploy frontend preview* again (Actions → Run workflow)."
            else
              echo "### Frontend preview deployed but LOCKED: $BASE"
              echo
              echo "No usable \`FRONTEND_PREVIEW_PASSWORD\` secret, so the preview was locked with random values nobody holds. Nothing was uploaded."
              echo "To open it: add the secret \`FRONTEND_PREVIEW_PASSWORD\` (12+ characters) under Settings → Environments → frontend-preview (or as a repository secret), then run *Deploy frontend preview* again."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
