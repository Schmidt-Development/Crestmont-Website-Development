name: Staging rollback rehearsal

# TEST-004 / INFRA-005: proves a bad staging deploy can be rolled back. Deploys the previous uploaded Worker version
# to 100% of staging traffic, verifies health, then restores the version that was serving before and verifies again.
# Runs after every successful staging deploy and on demand (staging serves the previous version for about a minute). Production is never touched; the D1 schema
# is unchanged (migrations are additive), so the rehearsal never alters data.

on:
  workflow_dispatch:
  # After every successful staging deploy, so recovery is re-proven against the build that is actually serving.
  workflow_run:
    workflows: ["Deploy staging"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-latest
    # main only: a manual run from another branch would execute that branch's (possibly older) copy of this file.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4
      BASE: ${{ vars.STAGING_URL || 'https://crestmont-platform-staging.partners-df4.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - name: Identify the serving and previous versions
        id: pick
        run: |
          echo "STARTED=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"
          mkdir -p drill evidence
          $WRANGLER deployments status --env staging --json > drill/status.json
          $WRANGLER versions list --env staging --json > drill/versions.json
          pair=$(node --no-warnings scripts/rollback-rehearsal.ts pick drill/status.json drill/versions.json)
          cur=${pair%% *}; prev=${pair##* }
          [ -n "$cur" ] && [ -n "$prev" ] && [ "$cur" != "$prev" ] || { echo "::error::could not identify the serving and previous versions"; exit 1; }
          echo "current=$cur" >> "$GITHUB_OUTPUT"; echo "previous=$prev" >> "$GITHUB_OUTPUT"
          echo "Serving $cur; rehearsing rollback to $prev"
      - name: Roll back to the previous version and verify
        id: back
        continue-on-error: true
        run: |
          set +e
          $WRANGLER versions deploy "${{ steps.pick.outputs.previous }}@100%" --env staging --message "Rollback rehearsal (run ${{ github.run_id }})" --yes > back.log 2>&1
          rc=$?; cat back.log
          if [ $rc -ne 0 ]; then echo "reason=deploy_command_failed: $(sed -e 's/\x1b\[[0-9;]*m//g' back.log | grep -iE 'code:|error|✘' | grep -v '^\s*$' | sed -E 's#/accounts/[^/]+/#/accounts/…/#' | tr -d '\r' | tr '\n' ' ' | cut -c1-400)" >> "$GITHUB_OUTPUT"; echo "::error::versions deploy failed"; exit 1; fi
          code=000
          for i in 1 2 3 4 5 6; do sleep 10; code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/health"); [ "$code" = "200" ] && exit 0; done
          echo "reason=health_check_failed: /api/health HTTP $code after 60 s" >> "$GITHUB_OUTPUT"
          echo "::error::health check failed after rollback"; exit 1
      - name: Roll forward to the version that was serving and verify
        id: fwd
        if: always()
        run: |
          $WRANGLER versions deploy "${{ steps.pick.outputs.current }}@100%" --env staging --message "Rollback rehearsal: restore (run ${{ github.run_id }})" --yes
          for i in 1 2 3 4 5 6; do sleep 10; [ "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/health")" = "200" ] && exit 0; done
          echo "::error::health check failed after restoring the serving version — check staging now"; exit 1
      - name: Record evidence on staging
        if: always() && steps.pick.outcome == 'success'
        env:
          BACK_REASON: ${{ steps.back.outputs.reason }}   # passed via env, never interpolated into the script
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EVIDENCE_INGEST_SECRET_STABLE: ${{ secrets.EVIDENCE_INGEST_SECRET }}
        run: |
          node --no-warnings scripts/rollback-rehearsal.ts evidence --commit "$GITHUB_SHA" --run-id "gh-${{ github.run_id }}-${{ github.run_attempt }}-rollback" --started "$STARTED" \
            --rollback "${{ steps.back.outcome == 'success' && 'passed' || 'failed' }}" --rollforward "${{ steps.fwd.outcome == 'success' && 'passed' || 'failed' }}" \
            --detail "$BACK_REASON" --out evidence/rollback.json
          # The same value deploy-staging.yml installed (GitHub secret, else the derived key); never put or rotated here,
          # because a secret change would block rollbacks.
          ev=$(node --no-warnings scripts/evidence-secret.ts print)
          echo "::add-mask::$ev"
          READINESS_URL="$BASE" EVIDENCE_INGEST_SECRET="$ev" node --no-warnings scripts/post-evidence.ts evidence/rollback.json
