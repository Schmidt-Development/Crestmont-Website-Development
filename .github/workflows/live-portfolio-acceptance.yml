name: Live portfolio acceptance (production, read-only)

# The mandatory live-portfolio acceptance on demand, the same check the production release runs in its
# verify-live-portfolio job (scripts/live-portfolio-check.mjs). In a real browser at desktop and phone sizes:
#   - every published project on /portfolio is interactive (its real live website or its isolated demo, never only a
#     screenshot);
#   - each scrolls inside its frame without moving Crestmont's page, navigates, reloads/resets and switches devices;
#   - Lead Haven Collective is published and shows its REAL live website.
#   - native live websites are judged as real sites (2026-11-18): protected routes still refuse framing and never load
#     in the frame, public pages do, and no Crestmont demo messages are required (scripts/preview-explorer-checks.mjs);
#   - at 1440 / 1280 / 820 / 390 / 320 px every project shows its real domain with content, scrolls in isolation,
#     animates, stays readable, keeps its controls uncovered and never overflows (scripts/live-portfolio-viewports.mjs;
#     one screenshot per project and width is kept as the `portfolio-viewports` artifact).
# It signs in nowhere, records nothing, uses NO secret and does not use the `production` environment (no approval
# pause), like the production smoke test. It runs the default branch's own scripts.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-portfolio-acceptance
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw/browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
      - name: Install Chromium (pinned Playwright)
        run: |
          npm install --prefix .pw --no-save --no-audit --no-fund --ignore-scripts playwright@1.48.2 > /dev/null
          .pw/node_modules/.bin/playwright install --with-deps chromium > /dev/null
      - name: Live portfolio acceptance (desktop and phone, real browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.pw/node_modules/playwright/index.mjs
        run: |
          set +e
          node scripts/live-portfolio-check.mjs "$PRODUCTION_URL" 6 --live lead-haven-collective --real all > accept.log 2>&1
          rc=$?
          cat accept.log
          { if [ "$rc" = 0 ]; then echo "## Feature verification: PASSED — live portfolio accepted on production"; else echo "## Feature verification: FAILED — the live portfolio was NOT accepted"; fi
            echo; grep -E '^(PASS|FAIL)' accept.log | grep -E 'FAIL|lead-haven|published projects' ; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Five widths — 1440, 1280, 820, 390 and 320 px (real browser, read-only)
        if: always()
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.pw/node_modules/playwright/index.mjs
        run: |
          set +e
          node scripts/live-portfolio-viewports.mjs "$PRODUCTION_URL" 6 portfolio-viewports > viewports.log 2>&1
          rc=$?
          cat viewports.log
          { if [ "$rc" = 0 ]; then echo "## Five widths: PASSED"; else echo "## Five widths: FAILED"; fi
            echo; grep -E '^FAIL' viewports.log ; tail -1 viewports.log ; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Native vs direct — rendering, WebGL (Lead Haven's Earth), scroll, click, animation (read-only)
        if: always()
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.pw/node_modules/playwright/index.mjs
        run: |
          set +e
          node scripts/live-native-visual.mjs "$PRODUCTION_URL" native-visual > visual.log 2>&1
          rc=$?
          cat visual.log
          { if [ "$rc" = 0 ]; then echo "## Native vs direct: PASSED"; else echo "## Native vs direct: FAILED"; fi; echo; grep -E '^FAIL' visual.log ; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-visual
          path: native-visual
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: portfolio-viewports
          path: portfolio-viewports
          retention-days: 30
