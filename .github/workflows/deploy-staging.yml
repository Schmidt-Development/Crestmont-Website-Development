name: Deploy staging

# Staging preview for the Founder (INFRA-002/INFRA-005). Self-provisioning: the ONLY prerequisites are the
# repository (or `staging` environment) secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID — see
# docs/STAGING-PREVIEW.md. The workflow creates the staging D1 database if missing, applies migrations,
# deploys the Worker behind the private preview gate, seeds clearly-labelled sample data and demo accounts
# on first run, and hands the access details to the Founder as a private workflow artifact.
# Production is never touched here (see deploy-production.yml, which requires Founder approval).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rotate_credentials:
        description: "Rotate the preview password and every demo account password and 2FA key (old ones stop working)"
        type: boolean
        default: false
      reseed_demo_accounts:
        description: "Create a fresh set of demo accounts and sample data (adds alongside existing)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        name: Check Cloudflare credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice title=Staging deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (docs/STAGING-PREVIEW.md). Nothing was deployed."
            echo "configured=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: staging
    # Read-only workflow token. The extra read scopes are used only by the "GitHub readiness snapshot"
    # step (READY-005): actions (workflow runs/jobs), pull-requests (open PRs), checks (annotations that
    # explain refused jobs), security-events (code scanning; 403 without Advanced Security = "unavailable").
    # No write permission is granted.
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      security-events: read
    # Security finding F-24: no secret is set for the whole job. The Cloudflare token and account id are given only to
    # the steps that run wrangler or call the Cloudflare API (step-level env below), never to npm install / tests /
    # the browser journey, which run third-party package code. tests/workflow-security.test.ts enforces this.
    env:
      DEPLOYMENT_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-staging
      # Bump to force a one-time rotation of all staging access credentials on the next run (scripts/staging-access.ts).
      # 2 = rotation after the preview-password mismatch of deploy #4 (2026-10-27).
      ACCESS_EPOCH: "2"
      WRANGLER: npx --yes wrangler@4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # the token is passed only to the snapshot step, never left in .git/config
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"   # >= 22.18 for native TypeScript

      - name: Install dev tooling
        run: npm install --no-save typescript@5 @types/node@22

      - name: Typecheck and tests (staging only receives code that passes)
        run: npx tsc -p tsconfig.json && npm test

      - name: Provision staging D1 database (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$($WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).find(d=>d.name==="crestmont-staging");process.stdout.write(r?r.uuid:"")})')
          if [ -z "$id" ]; then
            $WRANGLER d1 create crestmont-staging
            id=$($WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).find(d=>d.name==="crestmont-staging");process.stdout.write(r?r.uuid:"")})')
          fi
          [ -n "$id" ] || { echo "::error::Could not find or create the crestmont-staging D1 database"; exit 1; }
          # Inject the id into the staging block only (workspace copy; nothing is committed).
          node -e 'const fs=require("fs");let t=fs.readFileSync("wrangler.toml","utf8");t=t.replace(/(database_name = "crestmont-staging", database_id = )""/, `$1"${process.argv[1]}"`);fs.writeFileSync("wrangler.toml",t)' "$id"
          grep -q "$id" wrangler.toml && echo "Staging D1: $id"

      - name: File storage (R2) if available, otherwise disable uploads honestly
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        id: r2
        run: |
          if $WRANGLER r2 bucket list > r2-list.log 2> r2.err && grep -q "crestmont-files-staging" r2-list.log || $WRANGLER r2 bucket create crestmont-files-staging >> r2.err 2>&1; then
            echo "R2 bucket ready"; echo "state=bound" >> "$GITHUB_OUTPUT"
          else
            echo "state=unavailable" >> "$GITHUB_OUTPUT"
            # Why (for the public file-storage:staging feed): Cloudflare's error text, account id elided. Bucket names only.
            echo "reason=$(sed -e 's/\x1b\[[0-9;]*m//g' r2.err | grep -iE 'error|code|not enabled|permission|auth' | head -2 | tr '\n' ' ' | sed -E 's#/accounts/[^/]+/#/accounts/…/#' | cut -c1-240) buckets visible: $(grep -oE 'name:\s*\S+' r2-list.log | sed 's/name:\s*//' | tr '\n' ' ' | cut -c1-120)" >> "$GITHUB_OUTPUT"
            echo "::warning title=File uploads disabled on staging::R2 is not enabled on this Cloudflare account. Pages that store files will say storage is not configured. Enable R2 in the Cloudflare dashboard to turn uploads on."
            node -e 'const fs=require("fs");let t=fs.readFileSync("wrangler.toml","utf8");t=t.replace(/^r2_buckets = \[\{ binding = "FILES", bucket_name = "crestmont-files-staging" \}\]\n/m,"");fs.writeFileSync("wrangler.toml",t)'
          fi

      - name: Restore point (D1 Time Travel bookmark)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true
        run: |
          # D1 keeps point-in-time history; record where to restore to instead of exporting the database
          # (an export would copy demo password hashes and 2FA keys into a second artifact).
          $WRANGLER d1 time-travel info crestmont-staging --env staging --json > tt.json 2>/dev/null && \
            node -e 'const j=JSON.parse(require("fs").readFileSync("tt.json","utf8"));console.log("Pre-deploy D1 bookmark: "+(j.bookmark??JSON.stringify(j)))' | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f tt.json

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: $WRANGLER d1 migrations apply crestmont-staging --remote --env staging

      - name: Deploy Worker (staging, behind the preview gate)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        id: deploy
        run: |
          $WRANGLER deploy --env staging | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::No workers.dev URL in deploy output. Choose a workers.dev subdomain in the Cloudflare dashboard (Workers & Pages → Overview) and re-run."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Evidence ingest secret (stable; put only when changed)
        # Stable and put only when changed: any secret change blocks Worker rollbacks (Cloudflare 10220).
        # The GitHub secret EVIDENCE_INGEST_SECRET is used when it exists, so ci.yml, release.yml and deploy-production.yml
        # sign with the value staging holds; until then the key derived from the Cloudflare token is used (with a warning).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EVIDENCE_INGEST_SECRET_STABLE: ${{ secrets.EVIDENCE_INGEST_SECRET }}
        run: |
          ev=$(node --no-warnings scripts/evidence-secret.ts print)
          echo "::add-mask::$ev"
          printf '%s' "$ev" | node --no-warnings scripts/staging-secrets.ts put EVIDENCE_INGEST_SECRET
          echo "EVIDENCE_INGEST_SECRET=$ev" >> "$GITHUB_ENV"
          echo "Evidence secret fingerprint: $(EVIDENCE_INGEST_SECRET="$ev" node --no-warnings scripts/evidence-secret.ts fingerprint) (must match the Deploy production summary)." >> "$GITHUB_STEP_SUMMARY"

      - name: External scheduler key
        # Derived from the Cloudflare token secret (scripts/trigger-scheduler.ts), so the health monitor can trigger the
        # scheduled jobs when native Cron Triggers are unavailable on this account. Same value on every deploy.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          k=$(node --no-warnings scripts/trigger-scheduler.ts derive)
          echo "::add-mask::$k"
          printf '%s' "$k" | node --no-warnings scripts/staging-secrets.ts put SCHEDULER_TRIGGER_SECRET

      - name: Report file storage state (file-storage:staging feed)
        continue-on-error: true
        env:
          READINESS_URL: ${{ steps.deploy.outputs.url }}
          R2_STATE: ${{ steps.r2.outputs.state }}
          R2_REASON: ${{ steps.r2.outputs.reason }}   # via env, never interpolated into the script
        run: |
          node --no-warnings scripts/storage-evidence.ts --state "$R2_STATE" --reason "$R2_REASON" --commit "$GITHUB_SHA" --run-id "gh-${{ github.run_id }}-${{ github.run_attempt }}-r2" --out evidence/r2.json
          node --no-warnings scripts/post-evidence.ts evidence/r2.json

      - name: Verify cron triggers (and re-register them if missing)
        # READY-012 / INFRA-006: scheduled jobs had never run on staging. Compares Cloudflare's registered schedules
        # with wrangler.toml and repairs them through the Workers API. Non-fatal: the scheduler feed in
        # /api/readiness/health (required) and the external monitor report the outcome.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          READINESS_URL: ${{ steps.deploy.outputs.url }}
        run: |
          mkdir -p evidence
          set +e
          node --no-warnings scripts/verify-crons.ts --env staging --evidence evidence/cron-triggers.json --commit "$GITHUB_SHA" \
            --run-id "gh-${{ github.run_id }}-${{ github.run_attempt }}-crons" > cron.log 2>&1
          rc=$?
          set -e
          cat cron.log; cat cron.log >> "$GITHUB_STEP_SUMMARY"
          # Publishes the outcome as the cron-triggers:staging feed in /api/readiness/health, pass or fail.
          [ -f evidence/cron-triggers.json ] && node --no-warnings scripts/post-evidence.ts evidence/cron-triggers.json || true
          exit $rc

      - name: AI Builds runner secret (only when the Founder has provided one)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUNNER_SECRET: ${{ secrets.BUILD_RUNNER_SECRET }}
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$RUNNER_SECRET" ]; then printf '%s' "$RUNNER_SECRET" | node --no-warnings scripts/staging-secrets.ts put BUILD_RUNNER_SECRET
          else echo "BUILD_RUNNER_SECRET not provided: AI Builds execution stays unavailable on staging (builds wait in the queue)."; fi

      - name: Seed sample data and demo accounts (first run or on request)
        id: seed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEED: ${{ inputs.reseed_demo_accounts }}
        run: |
          n=$($WRANGLER d1 execute crestmont-staging --remote --env staging --json --command "SELECT COUNT(*) AS n FROM users WHERE email LIKE '%@crestmont-preview.test'" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(String(j[0].results[0].n))})')
          if [ "$n" = "0" ] || [ "$RESEED" = "true" ]; then
            # The seed's own random credentials are discarded: the next step applies the issued ones.
            node --no-warnings scripts/seed-staging.ts --out seed.sql --credentials "$RUNNER_TEMP/discard.md"
            rm -f "$RUNNER_TEMP/discard.md"
            $WRANGLER d1 execute crestmont-staging --remote --env staging --file seed.sql --yes
            echo "seeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "Demo data already present ($n demo accounts); not reseeding."
            echo "seeded=false" >> "$GITHUB_OUTPUT"
          fi

      # Security remediation 2026-10-28 (F-18). Every deploy audits how the demo accounts were used (counts in the summary,
      # details only in the sealed notes). When a rotation is due (rotate_credentials, or an ACCESS_EPOCH bump), the CURRENT
      # credentials are derived and an Owner session is held, so the run can prove afterwards that all of them stop working.
      - name: Exposure audit and pre-rotation hold (old credentials)
        id: rotpre
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIXED_PREVIEW_PASSWORD: ${{ secrets.STAGING_PREVIEW_PASSWORD }}
          ROTATE: ${{ inputs.rotate_credentials }}
          BASE: ${{ steps.deploy.outputs.url }}
        run: |
          mkdir -p access && chmod 700 access
          # Neither may block the deploy; a rotation that cannot be proven fails the post-check instead.
          node --no-warnings scripts/staging-rotation-check.ts audit --private access/exposure-audit.md || echo "::warning::Exposure audit failed (see above)."
          node --no-warnings scripts/staging-rotation-check.ts pre --url "$BASE" --state "$RUNNER_TEMP/rotation-state.json" || echo "::warning::Pre-rotation hold failed; a rotation in this run cannot be verified."

      - name: Apply staging access (preview password + demo accounts, rotated when due)
        id: access
        env:
          FIXED_PREVIEW_PASSWORD: ${{ secrets.STAGING_PREVIEW_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROTATE: ${{ inputs.rotate_credentials }}
          BASE: ${{ steps.deploy.outputs.url }}
        run: node --no-warnings scripts/staging-access.ts --url "$BASE" --out access

      - name: Verify the full access sequence on the live preview
        id: verify
        run: |
          node --no-warnings scripts/verify-staging-access.ts --access access/access.json \
            --url "${{ steps.deploy.outputs.url }}" --readme access/README.md

      - name: Smoke checks through the preview gate
        id: smoke
        env:
          BASE: ${{ steps.deploy.outputs.url }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/health"); [ "$code" = "200" ] || { echo "::error::/api/health returned $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/"); [ "$code" = "401" ] || { echo "::error::preview gate not active on / (HTTP $code)"; exit 1; }
          PW=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("access/private.json","utf8")).previewPassword)')
          cookie=$(curl -s -D - -o /dev/null --data-urlencode "password=$PW" --data-urlencode "next=/" "$BASE/__preview-access" | grep -i '^set-cookie: cm_preview=' | sed -E 's/^set-cookie: ([^;]+);.*/\1/I' | tr -d '\r')
          [ -n "$cookie" ] || { echo "::error::preview password was not accepted"; exit 1; }
          CHECK_COOKIE="$cookie" node --no-warnings scripts/production-checks.ts --base "$BASE" --environment staging --commit "$GITHUB_SHA" \
            --run-id "gh-${{ github.run_id }}-${{ github.run_attempt }}" --out evidence/staging-check.json

      - name: Browser journey on the preview (staging E2E evidence)
        id: e2e
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
          E2E_ACCOUNTS_FILE: access/demo-accounts.md
          EVIDENCE_ENVIRONMENT: staging
          EVIDENCE_FILE: evidence/staging-e2e.json
          EVIDENCE_SUFFIX: staging-e2e
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.pw/node_modules/playwright/index.mjs
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw/browsers
          AXE_PATH: ${{ github.workspace }}/.pw/node_modules/axe-core/axe.min.js
        run: |
          unset EVIDENCE_INGEST_SECRET   # set via GITHUB_ENV earlier; third-party packages below never see it (F-24)
          npm install --prefix .pw --no-save --no-audit --no-fund playwright@1.48.2 axe-core@4.10.2 > /dev/null
          .pw/node_modules/.bin/playwright install --with-deps chromium > /dev/null
          export E2E_PREVIEW_PASSWORD=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("access/private.json","utf8")).previewPassword)')
          node --no-warnings --test --test-concurrency=1 --test-reporter=./scripts/evidence-reporter.mjs tests/e2e/staging.e2e.ts tests/e2e/staging-quality.e2e.ts tests/e2e/staging-journeys.e2e.ts

      - name: Verify old credentials and sessions are rejected (rotation runs)
        id: rotpost
        if: always() && steps.verify.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASE: ${{ steps.deploy.outputs.url }}
        run: node --no-warnings scripts/staging-rotation-check.ts post --url "$BASE" --state "$RUNNER_TEMP/rotation-state.json" --access access/access.json

      - name: Record evidence and deployment
        if: always() && steps.deploy.outcome == 'success'
        env:
          READINESS_URL: ${{ steps.deploy.outputs.url }}
        run: |
          [ -f evidence/staging-check.json ] && node --no-warnings scripts/post-evidence.ts evidence/staging-check.json || true
          [ -f evidence/staging-e2e.json ] && node --no-warnings scripts/post-evidence.ts evidence/staging-e2e.json || true
          node --no-warnings scripts/post-deployment.ts --id "$DEPLOYMENT_ID" --environment staging --commit "$GITHUB_SHA" \
            --status succeeded --url "$READINESS_URL" --by "github-actions:${{ github.actor }}" \
            --ci-run "gh-${{ github.run_id }}-${{ github.run_attempt }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --verification "${{ steps.smoke.outcome == 'success' && 'passed' || 'failed' }}" || true

      - name: GitHub readiness snapshot (branches, commits, PRs, runs, tags, code scanning)
        # READY-005 push path: the workflow's read-only token reads GitHub; the Worker needs no PAT.
        # Runs only scripts/post-github-snapshot.ts (no npm packages are loaded); token and secret are never printed.
        if: always() && steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          READINESS_URL: ${{ steps.deploy.outputs.url }}
        run: node --no-warnings scripts/post-github-snapshot.ts

      - name: Access summary (no credentials)
        if: always() && steps.deploy.outcome == 'success'
        run: |
          rm -f access/private.json access/access.json access/demo-accounts.md "$RUNNER_TEMP/rotation-state.json"
          if [ "${{ steps.verify.outcome }}" = "success" ]; then
            echo "### Staging preview deployed and verified: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Preview password → Owner sign-in → 2FA → all 32 Owner modules verified on the live site." >> "$GITHUB_STEP_SUMMARY"
            echo "Credentials: **staging-preview-access** artifact of this run, sealed with ACCESS_ARTIFACT_PASSPHRASE (AES-256-GCM). Never in logs; never uploaded unencrypted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Staging access NOT verified — no access artifact was issued for this run." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Workflow artifacts of a PUBLIC repository can be downloaded by anyone signed in to GitHub. The access notes leave
      # the runner ONLY sealed with the Founder's ACCESS_ARTIFACT_PASSPHRASE (AES-256-GCM, scrypt; scripts/seal-access-notes.ts).
      # Without a passphrase of at least 16 characters nothing is uploaded — whatever the repository visibility (F-18).
      - name: Seal the access notes
        id: protect
        if: always() && steps.verify.outcome == 'success'
        env:
          ACCESS_ARTIFACT_PASSPHRASE: ${{ secrets.ACCESS_ARTIFACT_PASSPHRASE }}
        run: |
          set +e
          files="access/README.md"; [ -f access/exposure-audit.md ] && files="$files access/exposure-audit.md"
          node --no-warnings scripts/seal-access-notes.ts seal --out access/staging-access.cmseal $files
          rc=$?
          set -e
          rm -f access/README.md access/exposure-audit.md
          if [ "$rc" = "0" ]; then
            echo "upload=sealed" >> "$GITHUB_OUTPUT"
            echo "Decrypt locally: \`node --no-warnings scripts/seal-access-notes.ts open --in staging-access.cmseal --out staging-access.md\` (asks for ACCESS_ARTIFACT_PASSPHRASE). Delete the decrypted file after use." >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f access/staging-access.cmseal
            echo "upload=none" >> "$GITHUB_OUTPUT"
            echo "### Access notes NOT issued: set the repository secret ACCESS_ARTIFACT_PASSPHRASE (16+ characters) and re-run. Nothing was uploaded." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always() && steps.protect.outputs.upload == 'sealed'
        with:
          name: staging-preview-access
          path: access/staging-access.cmseal
          retention-days: 7
          if-no-files-found: error
