name: Deploy staging

# Staging preview for the Founder (INFRA-002/INFRA-005). Self-provisioning: the ONLY prerequisites are the
# repository (or `staging` environment) secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID — see
# docs/STAGING-PREVIEW.md. The workflow creates the staging D1 database if missing, applies migrations,
# deploys the Worker as a PUBLIC staging website (no preview password since 2026-10-28; noindex, staging banner,
# allowlisted email only), seeds clearly-labelled sample data and demo accounts
# on first run, and hands the access details to the Founder as a private workflow artifact.
# Production is never touched here (see deploy-production.yml, which requires Founder approval).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rotate_credentials:
        description: "Rotate every demo account password (Owner included) and 2FA key (old ones stop working)"
        type: boolean
        default: false
      reseed_demo_accounts:
        description: "Create a fresh set of demo accounts and sample data (adds alongside existing)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  preflight:
    # Staging is deployed only from main. A manual run from any other branch is skipped here; old branches carry older
    # copies of this file, so the `staging` environment must ALSO allow only `main` (Settings → Environments).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        name: Check Cloudflare credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice title=Staging deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (docs/STAGING-PREVIEW.md). Nothing was deployed."
            echo "configured=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: staging
    # Read-only workflow token. The extra read scopes are used only by the "GitHub readiness snapshot"
    # step (READY-005): actions (workflow runs/jobs), pull-requests (open PRs), checks (annotations that
    # explain refused jobs), security-events (code scanning; 403 without Advanced Security = "unavailable").
    # No write permission is granted.
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      security-events: read
    # F-24: no secret is set for the whole job. The Cloudflare token and account id are given only to the steps that run
    # wrangler or call the Cloudflare API (including the delivery gate, forensic snapshot, capture and revocation proof,
    # which read staging D1 through wrangler); no preview password exists any more. npm install, the
    # tests and the browser journey (third-party package code) receive none. tests/workflow-security.test.ts enforces this.
    env:
      DEPLOYMENT_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-staging
      # Bump to force a one-time rotation of all staging access credentials on the next run (scripts/staging-access.ts).
      # 2 = rotation after the preview-password mismatch of deploy #4 (2026-10-27).
      # 3 = rotation after plaintext access notes were exposed as public artifacts (2026-10-27/28). Lands in the same
      #     deploy that first protects the notes, so the new credentials are never uploaded in plaintext.
      ACCESS_EPOCH: "3"
      WRANGLER: npx --yes wrangler@4.149.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # the token is passed only to the snapshot step, never left in .git/config
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"   # >= 22.18 for native TypeScript

      - name: Install dev tooling
        run: npm install --no-save --ignore-scripts typescript@5 @types/node@22

      - name: Typecheck and tests (staging only receives code that passes)
        run: npx tsc -p tsconfig.json && npm test

      - name: Provision staging D1 database (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$($WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).find(d=>d.name==="crestmont-staging");process.stdout.write(r?r.uuid:"")})')
          if [ -z "$id" ]; then
            $WRANGLER d1 create crestmont-staging
            id=$($WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).find(d=>d.name==="crestmont-staging");process.stdout.write(r?r.uuid:"")})')
          fi
          [ -n "$id" ] || { echo "::error::Could not find or create the crestmont-staging D1 database"; exit 1; }
          # Inject the id into the staging block only (workspace copy; nothing is committed).
          node -e 'const fs=require("fs");let t=fs.readFileSync("wrangler.toml","utf8");t=t.replace(/(database_name = "crestmont-staging", database_id = )""/, `$1"${process.argv[1]}"`);fs.writeFileSync("wrangler.toml",t)' "$id"
          grep -q "$id" wrangler.toml && echo "Staging D1: $id"

      - name: File storage (R2) if available, otherwise disable uploads honestly
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        id: r2
        run: |
          if $WRANGLER r2 bucket list > r2-list.log 2> r2.err && grep -q "crestmont-files-staging" r2-list.log || $WRANGLER r2 bucket create crestmont-files-staging >> r2.err 2>&1; then
            echo "R2 bucket ready"; echo "state=bound" >> "$GITHUB_OUTPUT"
          else
            echo "state=unavailable" >> "$GITHUB_OUTPUT"
            # Why (for the public file-storage:staging feed): Cloudflare's error text, account id elided. Bucket names only.
            echo "reason=$(sed -e 's/\x1b\[[0-9;]*m//g' r2.err | grep -iE 'error|code|not enabled|permission|auth' | head -2 | tr '\n' ' ' | sed -E 's#/accounts/[^/]+/#/accounts/…/#' | cut -c1-240) buckets visible: $(grep -oE 'name:\s*\S+' r2-list.log | sed 's/name:\s*//' | tr '\n' ' ' | cut -c1-120)" >> "$GITHUB_OUTPUT"
            echo "::warning title=File uploads disabled on staging::R2 is not enabled on this Cloudflare account. Pages that store files will say storage is not configured. Enable R2 in the Cloudflare dashboard to turn uploads on."
            node -e 'const fs=require("fs");let t=fs.readFileSync("wrangler.toml","utf8");t=t.replace(/^r2_buckets = \[\{ binding = "FILES", bucket_name = "crestmont-files-staging" \}\]\n/m,"");fs.writeFileSync("wrangler.toml",t)'
          fi

      - name: Restore point (D1 Time Travel bookmark)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true
        run: |
          # D1 keeps point-in-time history; record where to restore to instead of exporting the database
          # (an export would copy demo password hashes and 2FA keys into a second artifact).
          $WRANGLER d1 time-travel info crestmont-staging --env staging --json > tt.json 2>/dev/null && \
            node -e 'const j=JSON.parse(require("fs").readFileSync("tt.json","utf8"));console.log("Pre-deploy D1 bookmark: "+(j.bookmark??JSON.stringify(j)))' | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f tt.json

      # A rotation must never leave the Founder without a way to receive the new Owner credentials.
      # Checked BEFORE anything is changed; nothing is printed but the verdict.
      - name: Credential delivery gate (before any rotation)
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_ARTIFACT_PASSPHRASE: ${{ secrets.ACCESS_ARTIFACT_PASSPHRASE }}
          ROTATE: ${{ inputs.rotate_credentials }}
        run: node --no-warnings scripts/staging-rotation-check.ts gate

      # Evidence first: a rotation deletes demo sessions, tokens and recovery codes. Full rows are sealed for the
      # Founder (public repository); only non-identifying counts reach the summary.
      - name: Forensic snapshot (before the rotation; sealed)
        if: steps.gate.outputs.pending == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_ARTIFACT_PASSPHRASE: ${{ secrets.ACCESS_ARTIFACT_PASSPHRASE }}
        run: |
          mkdir -p forensics
          node --no-warnings scripts/staging-forensics.ts --out forensics/snapshot.json
          node --no-warnings scripts/seal.ts seal forensics/snapshot.json forensics/staging-forensics.sealed
          rm -f forensics/snapshot.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.gate.outputs.pending == 'true'
        with:
          name: staging-forensics-sealed
          path: forensics/staging-forensics.sealed
          retention-days: 90
          if-no-files-found: error

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: $WRANGLER d1 migrations apply crestmont-staging --remote --env staging

      - name: Deploy Worker (staging, public website)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        id: deploy
        run: |
          $WRANGLER deploy --env staging | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::No workers.dev URL in deploy output. Choose a workers.dev subdomain in the Cloudflare dashboard (Workers & Pages → Overview) and re-run."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Evidence ingest secret (stable; put only when changed)
        # Stable and put only when changed: any secret change blocks Worker rollbacks (Cloudflare 10220).
        # The GitHub secret EVIDENCE_INGEST_SECRET is used when it exists, so ci.yml, release.yml and deploy-production.yml
        # sign with the value staging holds; until then the key derived from the Cloudflare token is used (with a warning).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EVIDENCE_INGEST_SECRET_STABLE: ${{ secrets.EVIDENCE_INGEST_SECRET }}
        run: |
          ev=$(node --no-warnings scripts/evidence-secret.ts print)
          echo "::add-mask::$ev"
          printf '%s' "$ev" | node --no-warnings scripts/staging-secrets.ts put EVIDENCE_INGEST_SECRET
          echo "EVIDENCE_INGEST_SECRET=$ev" >> "$GITHUB_ENV"
          echo "Evidence secret fingerprint: $(EVIDENCE_INGEST_SECRET="$ev" node --no-warnings scripts/evidence-secret.ts fingerprint) (must match the Deploy production summary)." >> "$GITHUB_STEP_SUMMARY"

      - name: External scheduler key
        # Derived from the Cloudflare token secret (scripts/trigger-scheduler.ts), so the health monitor can trigger the
        # scheduled jobs when native Cron Triggers are unavailable on this account. Same value on every deploy.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          k=$(node --no-warnings scripts/trigger-scheduler.ts derive)
          echo "::add-mask::$k"
          printf '%s' "$k" | node --no-warnings scripts/staging-secrets.ts put SCHEDULER_TRIGGER_SECRET

      - name: CRM import and erasure keys (derived; put only when changed)
        # PR #50. CRM_IMPORT_SECRET signs research-engine imports (POST /api/crm/v1/imports); CRM_ERASURE_HMAC_KEY keys the
        # privacy-erasure re-import tombstones. Derived from the Cloudflare token secret like the scheduler key: 256-bit,
        # stable across deploys, never printed (masked) and never committed.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          imp=$(node --no-warnings scripts/staging-secrets.ts derive crmImport)
          echo "::add-mask::$imp"
          printf '%s' "$imp" | node --no-warnings scripts/staging-secrets.ts put CRM_IMPORT_SECRET
          era=$(node --no-warnings scripts/staging-secrets.ts derive crmErasure)
          echo "::add-mask::$era"
          printf '%s' "$era" | node --no-warnings scripts/staging-secrets.ts put CRM_ERASURE_HMAC_KEY
          res=$(node --no-warnings scripts/staging-secrets.ts derive research)
          echo "::add-mask::$res"
          printf '%s' "$res" | node --no-warnings scripts/staging-secrets.ts put RESEARCH_RUNNER_SECRET

      - name: Report file storage state (file-storage:staging feed)
        continue-on-error: true
        env:
          READINESS_URL: ${{ steps.deploy.outputs.url }}
          R2_STATE: ${{ steps.r2.outputs.state }}
          R2_REASON: ${{ steps.r2.outputs.reason }}   # via env, never interpolated into the script
        run: |
          node --no-warnings scripts/storage-evidence.ts --state "$R2_STATE" --reason "$R2_REASON" --commit "$GITHUB_SHA" --run-id "gh-${{ github.run_id }}-${{ github.run_attempt }}-r2" --out evidence/r2.json
          node --no-warnings scripts/post-evidence.ts evidence/r2.json

      - name: Verify cron triggers (and re-register them if missing)
        # READY-012 / INFRA-006: scheduled jobs had never run on staging. Compares Cloudflare's registered schedules
        # with wrangler.toml and repairs them through the Workers API. Non-fatal: the scheduler feed in
        # /api/readiness/health (required) and the external monitor report the outcome.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          READINESS_URL: ${{ steps.deploy.outputs.url }}
        run: |
          mkdir -p evidence
          set +e
          node --no-warnings scripts/verify-crons.ts --env staging --evidence evidence/cron-triggers.json --commit "$GITHUB_SHA" \
            --run-id "gh-${{ github.run_id }}-${{ github.run_attempt }}-crons" > cron.log 2>&1
          rc=$?
          set -e
          cat cron.log; cat cron.log >> "$GITHUB_STEP_SUMMARY"
          # Publishes the outcome as the cron-triggers:staging feed in /api/readiness/health, pass or fail.
          [ -f evidence/cron-triggers.json ] && node --no-warnings scripts/post-evidence.ts evidence/cron-triggers.json || true
          exit $rc

      - name: AI Builds runner secret (only when the Founder has provided one)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUNNER_SECRET: ${{ secrets.BUILD_RUNNER_SECRET }}
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$RUNNER_SECRET" ]; then printf '%s' "$RUNNER_SECRET" | node --no-warnings scripts/staging-secrets.ts put BUILD_RUNNER_SECRET
          else echo "BUILD_RUNNER_SECRET not provided: AI Builds execution stays unavailable on staging (builds wait in the queue)."; fi

      # Retell, two workspaces (src/adapters/retell-workspaces.ts): RETELL_INBOUND_API_KEY (receptionist) and
      # RETELL_OUTBOUND_API_KEY (sales agent + Self-Improvement Engine). Keys already set on the Worker by hand are kept:
      # a key is put only when the matching `staging` environment secret exists AND its value changed (rollback-safe);
      # an absent GitHub secret touches nothing. Without RETELL_INBOUND_API_KEY the receptionist routes answer 401.
      - name: Retell workspace keys (only those the Founder has provided)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RETELL_INBOUND_KEY: ${{ secrets.RETELL_INBOUND_API_KEY }}
          RETELL_OUTBOUND_KEY: ${{ secrets.RETELL_OUTBOUND_API_KEY }}
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$RETELL_INBOUND_KEY" ]; then printf '%s' "$RETELL_INBOUND_KEY" | node --no-warnings scripts/staging-secrets.ts put RETELL_INBOUND_API_KEY
          else echo "RETELL_INBOUND_API_KEY not provided as a staging environment secret: the Worker's existing value (if any) is kept."; fi
          if [ -n "$RETELL_OUTBOUND_KEY" ]; then printf '%s' "$RETELL_OUTBOUND_KEY" | node --no-warnings scripts/staging-secrets.ts put RETELL_OUTBOUND_API_KEY
          else echo "RETELL_OUTBOUND_API_KEY not provided as a staging environment secret: the Worker's existing value (if any) is kept."; fi

      - name: Seed sample data and demo accounts (first run or on request)
        id: seed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEED: ${{ inputs.reseed_demo_accounts }}
        run: |
          n=$($WRANGLER d1 execute crestmont-staging --remote --env staging --json --command "SELECT COUNT(*) AS n FROM users WHERE email LIKE '%@crestmont-preview.test'" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(String(j[0].results[0].n))})')
          if [ "$n" = "0" ] || [ "$RESEED" = "true" ]; then
            # The seed's own random credentials are discarded: the next step applies the issued ones.
            node --no-warnings scripts/seed-staging.ts --out seed.sql --credentials "$RUNNER_TEMP/discard.md"
            rm -f "$RUNNER_TEMP/discard.md"
            $WRANGLER d1 execute crestmont-staging --remote --env staging --file seed.sql --yes
            echo "seeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "Demo data already present ($n demo accounts); not reseeding."
            echo "seeded=false" >> "$GITHUB_OUTPUT"
          fi

      # Consolidated from the frontend-preview Worker (docs/CONSOLIDATION.md). Fixed ids; --preserve-edits keeps Staff → Portfolio edits
      # (only the demo verification is refreshed after first setup), so it runs every deploy. A demo is marked ready only when, checked from this runner,
      # it answers /__demo/info AND its frame-ancestors names THIS staging origin; otherwise the explorer shows the poster.
      - name: Portfolio projects and their isolated demos (verified for the staging origin)
        id: portfolio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASE: ${{ steps.deploy.outputs.url }}
        run: |
          host=$(node -e 'process.stdout.write(new URL(process.env.BASE).hostname)')
          case "$host" in crestmont-platform-staging.*) ;; *) echo "::error::Unexpected staging host '$host'"; exit 1;; esac
          origins=$(node -e 'const t=require("fs").readFileSync("wrangler.toml","utf8");const s=t.indexOf("[env.staging]");const b=t.slice(s,t.indexOf("\n[env.",s+1));process.stdout.write((/PORTFOLIO_DEMO_ORIGINS = "([^"]*)"/.exec(b)||[])[1]||"")')
          verified=""; report=""
          for slug_url in $(node --no-warnings -e 'import("./src/content/portfolio-projects.ts").then(m=>console.log(m.PORTFOLIO_PROJECTS.map(p=>p.slug+"|"+p.demoUrl).join("\n")))'); do
            slug=${slug_url%%|*}; url=${slug_url#*|}; demo=${url%/}
            info=$(curl -s --max-time 15 "$demo/__demo/info" || true)
            fa=$(curl -s --max-time 15 -D - -o /dev/null "$demo/" | grep -i '^content-security-policy:' | grep -o "frame-ancestors[^;]*" || true)
            if echo "$info" | grep -q '"demo":true' && echo "$fa" | grep -qF "https://$host"; then verified="$verified,$slug"; report="$report\n- $slug: demo verified for staging ($demo)"
            else report="$report\n- $slug: not embeddable on staging yet (frame-ancestors must name https://$host) — poster shown"; fi
          done
          node --no-warnings scripts/portfolio-setup.ts --out portfolio.sql --origins "$origins" --verified "${verified#,}" --preserve-edits | tee portfolio-report.txt
          $WRANGLER d1 execute crestmont-staging --remote --env staging --file portfolio.sql --yes > /dev/null
          { echo "### Portfolio"; echo; sed 's/^/- /' portfolio-report.txt; printf "$report\n"; } >> "$GITHUB_STEP_SUMMARY"

      # Before rotating: sign in with the credentials that are live now and keep that session and one recovery code, so
      # the run can PROVE they stop working. Values stay on the runner (RUNNER_TEMP, 0600, masked) and are never uploaded.
      - name: Capture the pre-rotation access (for the revocation proof)
        if: steps.gate.outputs.pending == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROTATE: ${{ inputs.rotate_credentials }}
        run: node --no-warnings scripts/staging-rotation-check.ts capture --url "${{ steps.deploy.outputs.url }}" --state "$RUNNER_TEMP/rotation-state.json"

      - name: Apply staging access (demo accounts, rotated when due)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROTATE: ${{ inputs.rotate_credentials }}
          # Optional. When the staging environment secret STAGING_MFA_ENCRYPTION_KEY holds the SAME value as the staging
          # Worker secret MFA_ENCRYPTION_KEY, demo 2FA secrets are written already encrypted. Without it they are written
          # in plaintext only when first issued or rotated, and the Worker encrypts each at its next sign-in.
          MFA_ENCRYPTION_KEY: ${{ secrets.STAGING_MFA_ENCRYPTION_KEY }}
        run: node --no-warnings scripts/staging-access.ts --url "${{ steps.deploy.outputs.url }}" --out access

      # Read-only, every run: the last rotation is complete in D1 (no credential needed; counts and PASS/FAIL only).
      - name: Rotation state in D1 (old demo sessions, tokens and recovery codes are gone)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --no-warnings scripts/staging-rotation-check.ts state

      # Deploys #71-#72: every second-factor attempt counts toward the account's limit (8 per 15 minutes,
      # src/services/auth.ts), so back-to-back deploys left the shared demo Owner without attempts: the access check below
      # and five browser journeys were refused ("Too many codes entered"). This read-only check applies the app's own
      # window rule to staging D1 and waits until this run's Owner codes fit: the access check (1), sign-ins in
      # staging.e2e, staging-quality and the journeys (3) and three journey step-ups (3: a stale-request cleanup in journey 26,
      # journey 26's decision, and the Stripe test-mode refund issued after journey 26). The CRM E2E guards its own budget.
      # The limit itself is unchanged.
      - name: Wait for the Owner's two-factor attempts (rate window; read-only)
        id: mfa_budget
        timeout-minutes: 35
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --no-warnings scripts/wait-mfa-budget.ts --accounts access/demo-accounts.md --role owner --need 7 --timeout 1920

      - name: Verify the full access sequence on the live site
        id: verify
        run: |
          node --no-warnings scripts/verify-staging-access.ts --access access/access.json \
            --url "${{ steps.deploy.outputs.url }}" --readme access/README.md

      # Public staging (2026-10-28): a fresh visitor with NO cookies sees the website; protected areas still refuse
      # anonymous visitors; every response is noindex and robots.txt disallows all. No credential is used here.
      - name: Smoke checks on the public site (fresh visitor, no cookies)
        id: smoke
        env:
          BASE: ${{ steps.deploy.outputs.url }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/health"); [ "$code" = "200" ] || { echo "::error::/api/health returned $code"; exit 1; }
          home=$(curl -s -D home.h "$BASE/"); code=$(head -1 home.h | awk '{print $2}')
          [ "$code" = "200" ] || { echo "::error::public homepage returned HTTP $code with no cookies"; exit 1; }
          if printf '%s' "$home" | grep -q '__preview-access'; then echo "::error::the preview password page is still shown"; exit 1; fi
          grep -qi '^x-robots-tag: noindex, nofollow' home.h || { echo "::error::homepage is missing X-Robots-Tag noindex"; exit 1; }
          [ "$(curl -s "$BASE/robots.txt")" = "$(printf 'User-agent: *\nDisallow: /')" ] || { echo "::error::robots.txt does not disallow all"; exit 1; }
          for path in /staff /staff/owner /portal /account; do
            r=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$BASE$path")
            case "$r" in "303 $BASE/login"*|401*|403*) echo "ok   $path refused anonymously ($r)";;
              "200 "*) echo "::error::$path opened without a session"; exit 1;;
              *) echo "::error::$path should redirect to sign-in, got $r"; exit 1;; esac
          done
          rm -f home.h
          node --no-warnings scripts/production-checks.ts --base "$BASE" --environment staging --commit "$GITHUB_SHA" \
            --run-id "gh-${{ github.run_id }}-${{ github.run_attempt }}" --out evidence/staging-check.json

      # Proves staging serves THIS commit's frontend (consolidated from the frontend-preview Worker): sha256 of key assets
      # equals the repository files, and the public homepage carries the approved design markers. No secrets, no cookies.
      - name: Frontend assets and homepage served by this commit
        id: frontend
        if: steps.smoke.outcome == 'success'
        env:
          BASE: ${{ steps.deploy.outputs.url }}
        run: |
          fail=0
          for f in assets/app.css assets/app.js assets/nojs.css assets/assistant.js assets/portfolio.js assets/services.js assets/fonts/InterDisplay-Medium.woff assets/art/hero-build.webp assets/art/stage-build.webp assets/portfolio/glassly-auto-glass-desktop.webp; do
            want=$(sha256sum "public/$f" | cut -d' ' -f1); got=$(curl -s "$BASE/$f" | sha256sum | cut -d' ' -f1)
            if [ "$want" = "$got" ]; then echo "ok   $f"; else echo "::error::$f served $got, expected $want"; fail=1; fi
          done
          home=$(curl -s "$BASE/")
          for marker in 'class="intro"' 'data-statement' 'data-stages' 'class="bento"' 'data-switch' 'hero-build.webp' 'data-cb-launch'; do
            if printf '%s' "$home" | grep -q "$marker"; then echo "ok   homepage contains $marker"; else echo "::error::homepage is missing $marker"; fail=1; fi
          done
          for path in /services /pricing /pricing/compare /portfolio /process /about /contact /faq /login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE$path"); [ "$code" = "200" ] && echo "ok   $path 200" || { echo "::error::$path returned $code"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "Staging serves the consolidated frontend of ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
          exit $fail

      # Journeys 29 and 30 check that readiness shows THIS run's signed evidence. Signing needs EVIDENCE_INGEST_SECRET,
      # which the browser step must never hold (F-24: it runs third-party packages), so the documents are signed and
      # posted here by first-party code only, and the journeys read the receipts. Deploy #61: both were unrunnable.
      - name: Post this run's evidence for the readiness journeys (signed; first-party code only)
        id: ingest
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        env:
          READINESS_URL: ${{ steps.deploy.outputs.url }}
        run: |
          mkdir -p evidence/receipts
          [ -f evidence/ci-evidence.json ] && node --no-warnings scripts/post-evidence.ts evidence/ci-evidence.json --receipt evidence/receipts/ci.json > /dev/null || echo "::warning title=CI evidence not posted::evidence/ci-evidence.json missing or refused"
          [ -f evidence/staging-check.json ] && node --no-warnings scripts/post-evidence.ts evidence/staging-check.json --receipt evidence/receipts/staging-check.json > /dev/null || echo "::warning title=Staging verification not posted::evidence/staging-check.json missing or refused"

      - name: Browser journey on the live site (staging E2E evidence)
        id: e2e
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
          E2E_ACCOUNTS_FILE: access/demo-accounts.md
          EVIDENCE_ENVIRONMENT: staging
          EVIDENCE_FILE: evidence/staging-e2e.json
          EVIDENCE_SUFFIX: staging-e2e
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.pw/node_modules/playwright/index.mjs
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw/browsers
          AXE_PATH: ${{ github.workspace }}/.pw/node_modules/axe-core/axe.min.js
        run: |
          unset EVIDENCE_INGEST_SECRET   # set via GITHUB_ENV earlier; third-party packages below never see it (F-24)
          npm install --prefix .pw --no-save --no-audit --no-fund --ignore-scripts playwright@1.48.2 axe-core@4.10.2 > /dev/null
          .pw/node_modules/.bin/playwright install --with-deps chromium > /dev/null
          node --no-warnings --test --test-concurrency=1 --test-reporter=./scripts/evidence-reporter.mjs tests/e2e/staging.e2e.ts tests/e2e/staging-quality.e2e.ts tests/e2e/staging-journeys.e2e.ts

      # PR #50: CRM duplicate protection against the live Worker and the real staging D1 (synthetic data only, erased at
      # the end): migrations 0048/0049, schema, backfill, signed research imports, idempotency, concurrent duplicates,
      # shared lines, suppression and do-not-call, the manual duplicate warning and privacy erasure via the Owner route.
      - name: CRM duplicate protection E2E (live staging + D1)
        id: crm_e2e
        if: steps.smoke.outcome == 'success'
        # Gate like the browser journeys (CREST-GAP-030): continue so hosted verification, evidence and cleanup still run;
        # the last step fails the deploy when this failed.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
          E2E_ACCOUNTS_FILE: access/demo-accounts.md
        run: |
          unset EVIDENCE_INGEST_SECRET
          CRM_IMPORT_SECRET=$(node --no-warnings scripts/staging-secrets.ts derive crmImport)
          echo "::add-mask::$CRM_IMPORT_SECRET"
          export CRM_IMPORT_SECRET
          node --no-warnings scripts/crm-staging-e2e.ts

      # Lead research (PR #48). Real Overture places for a small public bounding box, extracted by a step that holds no
      # credentials (the DuckDB package and the open-data download run without secrets), then researched by the real
      # worker code against their live websites and delivered to this staging Worker and staging D1. A few qualified
      # prospects are promoted into the staging CRM through the Owner route. Nothing is ever dialled (D-14).
      - name: Lead research candidates (Overture open data; no credentials)
        id: research_candidates
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        env:
          DUCKDB_PATH: ${{ github.workspace }}/research-worker/live/duckdb-shim.py
        run: |
          python3 -m pip install --quiet --disable-pip-version-check "duckdb>=1.1,<2"
          node --no-warnings research-worker/live/overture-sample.ts --request research-worker/live/staging-e2e-request.json --out e2e/candidates.jsonl

      - name: Lead research E2E (live staging + D1 + CRM)
        id: research_e2e
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
          E2E_ACCOUNTS_FILE: access/demo-accounts.md
        run: |
          unset EVIDENCE_INGEST_SECRET
          test -s e2e/candidates.jsonl || { echo "::error title=Lead research E2E::no Overture candidates were extracted"; exit 1; }
          RESEARCH_RUNNER_SECRET=$(node --no-warnings scripts/staging-secrets.ts derive research)
          echo "::add-mask::$RESEARCH_RUNNER_SECRET"
          export RESEARCH_RUNNER_SECRET
          node --no-warnings scripts/research-staging-e2e.ts --candidates e2e/candidates.jsonl --request research-worker/live/staging-e2e-request.json

      # The frontend's hosted browser suite (previously run only against the frontend-preview Worker): every public page at
      # desktop and phone size, interactions, the portfolio explorer and each verified demo, recorded tours. No secrets;
      # the contact form is filled but never submitted here (staging's database and email provider are persistent).
      - name: Frontend browser verification on staging (pages, interactions, portfolio demos)
        id: frontend_browser
        if: steps.frontend.outcome == 'success'
        env:
          BASE: ${{ steps.deploy.outputs.url }}
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.pwf/node_modules/playwright/index.mjs
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pwf/browsers
        run: |
          unset EVIDENCE_INGEST_SECRET   # set via GITHUB_ENV earlier; third-party packages below never see it (F-24)
          npm install --prefix .pwf --no-save --no-audit --no-fund --ignore-scripts playwright@1.63.0 > pwf-install.log 2>&1 || { echo "::error title=Playwright install failed::$(tail -c 600 pwf-install.log | tr '\n' ' ')"; exit 1; }
          .pwf/node_modules/.bin/playwright install --with-deps chromium > pwf-browsers.log 2>&1 || { echo "::error title=Chromium install failed::$(tail -c 600 pwf-browsers.log | tr '\n' ' ')"; exit 1; }
          node --no-warnings scripts/frontend-browser-check.mjs "$BASE" evidence/frontend-browser

      - name: Upload frontend recordings and screenshots (public pages only; no credentials)
        if: always() && steps.frontend_browser.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-frontend-browser
          path: evidence/frontend-browser
          retention-days: 14
          if-no-files-found: ignore

      - name: Prove the old access is revoked and the new access works
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        id: revoked
        if: always() && steps.verify.outcome == 'success' && steps.gate.outputs.pending == 'true'
        run: |
          node --no-warnings scripts/staging-rotation-check.ts verify --url "${{ steps.deploy.outputs.url }}" \
            --state "$RUNNER_TEMP/rotation-state.json" --access access/access.json

      - name: Record evidence and deployment
        if: always() && steps.deploy.outcome == 'success'
        env:
          READINESS_URL: ${{ steps.deploy.outputs.url }}
        run: |
          [ -f evidence/staging-check.json ] && node --no-warnings scripts/post-evidence.ts evidence/staging-check.json || true
          [ -f evidence/staging-e2e.json ] && node --no-warnings scripts/post-evidence.ts evidence/staging-e2e.json || true
          node --no-warnings scripts/post-deployment.ts --id "$DEPLOYMENT_ID" --environment staging --commit "$GITHUB_SHA" \
            --status succeeded --url "$READINESS_URL" --by "github-actions:${{ github.actor }}" \
            --ci-run "gh-${{ github.run_id }}-${{ github.run_attempt }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --verification "${{ steps.smoke.outcome == 'success' && 'passed' || 'failed' }}" || true

      - name: GitHub readiness snapshot (branches, commits, PRs, runs, tags, code scanning)
        # READY-005 push path: the workflow's read-only token reads GitHub; the Worker needs no PAT.
        # Runs only scripts/post-github-snapshot.ts (no npm packages are loaded); token and secret are never printed.
        if: always() && steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          READINESS_URL: ${{ steps.deploy.outputs.url }}
        run: node --no-warnings scripts/post-github-snapshot.ts

      - name: Access summary (no credentials)
        if: always() && steps.deploy.outcome == 'success'
        run: |
          rm -f access/private.json access/access.json access/demo-accounts.md
          if [ "${{ steps.verify.outcome }}" = "success" ]; then
            echo "### Staging deployed and verified (public website): ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Public site with no cookies → protected areas refused anonymously → Owner sign-in → 2FA required → all 32 Owner modules verified on the live site." >> "$GITHUB_STEP_SUMMARY"
            echo "Credentials: **staging-access-sealed** artifact of this run (AES-256-GCM; only the ACCESS_ARTIFACT_PASSPHRASE opens it; never in logs)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Staging access NOT verified — no access artifact was issued for this run." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Workflow artifacts of this PUBLIC repository can be downloaded by anyone signed in to GitHub. Access notes are
      # therefore sealed (authenticated encryption, scripts/seal.ts) with the Founder's ACCESS_ARTIFACT_PASSPHRASE, or
      # not issued at all. There is no plaintext path, whatever the repository's visibility.
      - name: Seal the access notes
        id: protect
        if: always() && steps.verify.outcome == 'success'
        env:
          ACCESS_ARTIFACT_PASSPHRASE: ${{ secrets.ACCESS_ARTIFACT_PASSPHRASE }}
        run: |
          if node --no-warnings scripts/seal.ts check > /dev/null 2>&1; then
            node --no-warnings scripts/seal.ts seal access/README.md access/staging-access.sealed
            rm -f access/README.md
            echo "upload=sealed" >> "$GITHUB_OUTPUT"
            echo "Open the sealed notes: \`node --no-warnings scripts/seal.ts open staging-access.sealed\` (asks for the passphrase; docs/STAGING-PREVIEW.md)." >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f access/README.md
            echo "upload=none" >> "$GITHUB_OUTPUT"
            echo "::warning title=Access notes not issued::No usable ACCESS_ARTIFACT_PASSPHRASE secret (32+ characters), so no credentials were uploaded. See docs/STAGING-PREVIEW.md."
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.protect.outputs.upload == 'sealed'
        with:
          name: staging-access-sealed
          path: access/staging-access.sealed
          retention-days: 7
          if-no-files-found: error

      - name: Remove credentials and evidence from the runner
        if: always()
        run: rm -rf access forensics e2e "$RUNNER_TEMP/rotation-state.json"

      # Read-only Stripe diagnostics written by the journeys (Owner's monitoring view, disputes, the journey customer's billing
      # and projects pages), as annotations: review sessions can read annotations when the raw log is not downloadable.
      - name: Stripe staging diagnostics (read-only)
        if: always()
        continue-on-error: true
        run: |
          [ -f evidence/stripe-diagnostics.txt ] || { echo "No Stripe diagnostics were written."; exit 0; }
          while IFS= read -r line; do printf '::notice title=Stripe diagnostics::%s\n' "$(printf '%s' "$line" | sed -e 's/%/%25/g')"; done < evidence/stripe-diagnostics.txt

      # Staging certification (33 required journeys) — published on every run; only 33/33 passed is "certified".
      - name: Staging certification summary
        if: always() && steps.e2e.outcome != 'skipped'
        run: |
          if [ -f evidence/staging-certification.json ]; then
            node -e 'const c=require("./evidence/staging-certification.json");const l=[`### Staging certification: ${c.certified?"CERTIFIED":"NOT CERTIFIED"} (${c.passed}/${c.required} passed, ${c.failed} failed)`,"",...c.notPassed.map(j=>`- journey ${j.journey}: ${j.outcome}`)];console.log(l.join("\n"))' >> "$GITHUB_STEP_SUMMARY"
            # The same result as annotations (readable through the checks API without the job log).
            node -e 'const c=require("./evidence/staging-certification.json");const e=(v)=>String(v).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log(`::notice title=Staging certification::${c.certified?"CERTIFIED":"NOT CERTIFIED"} ${c.passed}/${c.required} passed, ${c.failed} failed, ${c.required-c.passed-c.failed} skipped or blocked`);for(const j of c.notPassed)console.log(`::${j.outcome.startsWith("failed")?"error":"warning"} title=Staging journey ${j.journey}::${e(j.outcome.slice(0,500))}`)'
          else
            echo "### Staging certification: NOT CERTIFIED (the journey summary did not run)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # CREST-GAP-030: the browser journeys are a deployment gate. They run with continue-on-error only so that evidence,
      # deployment records, sealed access notes and cleanup above still happen; this last step then fails the run.
      - name: Fail the deploy when the staging browser journeys failed
        if: always() && steps.e2e.outcome == 'failure'
        run: |
          echo "::error title=Staging E2E failed::One or more staging browser journeys failed; see the 'Browser journey on the live site' step."
          exit 1

      - name: Fail the deploy when the CRM duplicate protection E2E failed
        if: always() && steps.crm_e2e.outcome == 'failure'
        run: |
          echo "::error title=CRM staging E2E failed::The CRM duplicate protection E2E failed; see its annotations and the 'CRM duplicate protection E2E' step."
          exit 1

      - name: Fail the deploy when the lead research E2E failed
        if: always() && (steps.research_candidates.outcome == 'failure' || steps.research_e2e.outcome == 'failure')
        run: |
          echo "::error title=Lead research staging E2E failed::See the 'Lead research E2E' step and its annotations."
          exit 1
