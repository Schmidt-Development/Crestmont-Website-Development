name: Stripe staging check

# Independent Stripe staging check (scripts/stripe-staging-check.ts), about two minutes instead of a full staging deploy.
# Each run: a FRESH read-only Stripe query made by the staging Worker (which holds the key; this workflow never does),
# one genuine Stripe test-mode event delivered to the configured destination and verified as stored (signature checked
# with the configured signing secret), binding names, events received, and a live check that unsigned and forged events
# are refused. D1 is read with SELECT only; no secret, variable or webhook destination is ever written. Full-deploy
# certification is unchanged.
on:
  workflow_dispatch:
    inputs:
      deliver:
        description: "Also request one genuine Stripe test-mode event (a $1 Checkout Session created and expired at once) and verify its signed delivery"
        type: boolean
        default: true
  # After every staging deploy (whatever its certification outcome), so the check always runs against the deployed Worker.
  workflow_run:
    workflows: ["Deploy staging"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/stripe-staging-check.yml
      - scripts/stripe-staging-check.ts

permissions:
  contents: read

concurrency:
  group: stripe-staging-check
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      BASE: ${{ vars.STAGING_URL || 'https://crestmont-platform-staging.partners-df4.workers.dev' }}
      WRANGLER: npx --yes wrangler@4.149.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
      - name: Stripe staging check (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # derives the scheduler key that signs the Worker check request
          STRIPE_CHECK_DELIVER: ${{ github.event_name != 'workflow_dispatch' || inputs.deliver }}
        run: node --no-warnings scripts/stripe-staging-check.ts --url "$BASE"
