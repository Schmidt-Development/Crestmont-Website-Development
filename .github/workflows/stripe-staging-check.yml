name: Stripe staging check

# Narrow, read-only Stripe staging check (scripts/stripe-staging-check.ts): about a minute instead of a full staging
# deploy (45-50 min, whose results appear only when the whole job ends). Founder-managed binding names, the last Stripe
# probe (account, endpoints, event destinations), Stripe events received, payments recorded, and a live check that the
# webhook refuses unsigned and forged events. Reads D1 with SELECT only; never calls Stripe; never prints a value;
# never writes a secret, variable or webhook destination. Full-deploy certification is unchanged.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/stripe-staging-check.yml
      - scripts/stripe-staging-check.ts

permissions:
  contents: read

concurrency:
  group: stripe-staging-check
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'   # main only (see deploy-staging.yml)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: staging
    env:
      BASE: ${{ vars.STAGING_URL || 'https://crestmont-platform-staging.partners-df4.workers.dev' }}
      WRANGLER: npx --yes wrangler@4.149.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
      - name: Stripe staging check (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --no-warnings scripts/stripe-staging-check.ts --url "$BASE"
