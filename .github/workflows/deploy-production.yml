name: Deploy production

# INFRA-005, LAUNCH-003, §78–§79. Simplified release flow (Founder, 2026-11-12): one deployment pipeline, no separate
# release-approval screen.
# - Runs automatically when CI succeeds on main, or by hand (workflow_dispatch; the commit defaults to main's head).
# - Refuses any commit that is not on main or whose CI run did not succeed (required tests), then runs the typecheck and
#   the full test suite again here before anything changes.
# - Runs in the GitHub `production` environment, which holds the production credentials. Required reviewers on that
#   environment are a GitHub setting (Settings → Environments → production); without them a green main deploys itself.
# - Before changing production: required Worker secrets present, no deferred AI system switched on, a private safety
#   export of the database, and, when the committed configuration opens live payments, a read-only check of the live
#   Stripe account and webhook endpoint through the running Worker (no charge, nothing created).
# - After deploying: binding preservation, the post-deploy production checks and the public smoke test; on a critical
#   failure the Worker is rolled back automatically (`wrangler rollback`). Every step is recorded as deployment evidence.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Full 40-character commit SHA on main to deploy (empty: the head of main)"
        required: false
        type: string
      tag:
        description: "Release tag of that commit (e.g. v1.0.0), for the record (optional)"
        required: false
        type: string

permissions:
  contents: read
  actions: read   # read the CI result for the commit (github.token, this repository only)

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # A CI run that did not succeed, or one on another branch, deploys nothing.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    # F-24: no secret is set for the whole job. The Cloudflare token goes only to the steps that run wrangler and the
    # evidence secret only to the steps that sign evidence; npm install / typecheck / tests (third-party package code)
    # receive neither. tests/workflow-security.test.ts enforces this.
    env:
      READINESS_URL: ${{ vars.READINESS_URL }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      TARGET_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit || github.sha }}
      # F-23: free-text input reaches scripts only through this variable, never interpolated into `run:`.
      RELEASE_TAG: ${{ inputs.tag }}
      DEPLOYMENT_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-production
      WRANGLER: npx --yes wrangler@4.149.0
    steps:
      - name: Validate inputs (F-23)
        run: |
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full 40-character SHA"; exit 1; }
          [[ -z "$RELEASE_TAG" || "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::tag must look like v1.2.3 or v1.2.3-rc.1"; exit 1; }

      - name: Refuse unless production is provisioned
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_EVIDENCE: ${{ secrets.EVIDENCE_INGEST_SECRET != '' }}
        run: |
          missing=""
          [ "$HAS_CF_TOKEN" = "true" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ "$HAS_CF_ACCOUNT" = "true" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ "$HAS_EVIDENCE" = "true" ] || missing="$missing EVIDENCE_INGEST_SECRET"
          [ -n "$READINESS_URL" ] || missing="$missing READINESS_URL(var)"
          [ -n "$PRODUCTION_URL" ] || missing="$missing PRODUCTION_URL(var)"
          if [ -n "$missing" ]; then
            echo "::error title=Production not provisioned::Missing on the 'production' environment:$missing (BLK-003). Nothing was deployed. See docs/DEPLOYMENT.md."
            exit 1
          fi
          echo "$TARGET_COMMIT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::inputs.commit must be the full 40-character lowercase SHA."; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit || github.sha }}
          fetch-depth: 0

      - name: Verify the checked-out commit is the requested one and is on main
        run: |
          [ "$(git rev-parse HEAD)" = "$TARGET_COMMIT" ] || { echo "::error::Checked-out HEAD $(git rev-parse HEAD) is not $TARGET_COMMIT."; exit 1; }
          git fetch origin main --quiet
          git merge-base --is-ancestor "$TARGET_COMMIT" origin/main || { echo "::error::$TARGET_COMMIT is not on main. Only reviewed commits on main can be released."; exit 1; }
          if awk '/^\[env\.production\]/{s=1} s' wrangler.toml | grep -q 'database_id = ""'; then
            echo "::error::wrangler.toml [env.production] still has an empty database_id (docs/DEPLOYMENT.md §2)."; exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"

      - name: Evidence secret fingerprint (compare with the staging deploy summary; the value is never shown)
        env:
          EVIDENCE_INGEST_SECRET: ${{ secrets.EVIDENCE_INGEST_SECRET }}
        run: |
          fp=$(node --no-warnings scripts/evidence-secret.ts fingerprint)
          echo "Evidence secret fingerprint: $fp (must equal the fingerprint in the latest Deploy staging summary, or release authorization returns 401)." >> "$GITHUB_STEP_SUMMARY"

      - name: Configuration digest (bound to the release candidate)
        id: cfg
        run: echo "sha256=$(node --no-warnings scripts/release-candidate.ts --print-config-digest)" >> "$GITHUB_OUTPUT"

      - name: CI succeeded for exactly this commit (required tests)
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TARGET_COMMIT&status=success&per_page=1" --jq '.total_count')
          [ "${ok:-0}" -ge 1 ] || { echo "::error title=CI has not passed::No successful CI run for $TARGET_COMMIT. Nothing was deployed."; exit 1; }
          echo "CI passed for $TARGET_COMMIT." >> "$GITHUB_STEP_SUMMARY"
          # Phased launch: every AI system in the production gates stays off unless its gate is lifted in code.
          echo "deferred_subsystems=$(node --no-warnings -e 'import("./src/readiness/phased-release.ts").then(m=>process.stdout.write(JSON.stringify(m.PRODUCTION_GATES.map(g=>g.subsystem))))')" >> "$GITHUB_OUTPUT"

      # Before any change: the production Worker must hold the secrets production cannot work without (names only; the
      # values are never read), and — phased release, docs/PHASED-LAUNCH.md — no secret may switch on a deferred AI
      # system (the authorization step already refused a configuration that does; a Worker secret can do it too).
      # MFA_ENCRYPTION_KEY: without it no Owner or staff account can enrol two-factor, so the release would be unusable.
      - name: Production Worker secrets — required present, none switches on a deferred AI system
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEFERRED_SUBSYSTEMS: ${{ steps.auth.outputs.deferred_subsystems }}
          REQUIRED_SECRETS: '["TURNSTILE_SITE_KEY","TURNSTILE_SECRET","EVIDENCE_INGEST_SECRET","MFA_ENCRYPTION_KEY"]'
        run: |
          trap 'rm -f secrets.json' EXIT
          $WRANGLER secret list --env production --format json > secrets.json
          node --no-warnings scripts/phase-check.ts wrangler.toml secrets.json

      - name: Install dev tooling
        run: npm install --no-save --ignore-scripts typescript@5 @types/node@22

      - name: Typecheck
        run: npx tsc -p tsconfig.json

      - name: Unit / integration tests
        run: npm test

      - name: Safety export of the production database (BACKUP-RECOVERY §3.2)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p backups
          # First release only: a brand-new database has no tables, so there is nothing to export (and D1's
          # export of an empty database is not relied on). Any database that has tables is always exported.
          tables=$($WRANGLER d1 execute crestmont-production --remote --env production --json --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%'" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(String(j[0].results[0].n))})')
          if [ "$tables" = "0" ]; then
            echo "Production database is empty (first release): no pre-deploy export needed." | tee backups/EMPTY-DATABASE.txt
          else
            $WRANGLER d1 export crestmont-production --remote --env production --output "backups/pre-deploy-production-${TARGET_COMMIT}.sql"
          fi
          sha256sum backups/* | tee backups/SHA256SUMS

      # The repository is public: a workflow artifact can be downloaded by anyone signed in to GitHub, so a
      # production database export is NEVER uploaded as an artifact. It goes to the private production
      # bucket under _backups/ (lifecycle rule: delete after 30 days, docs/DEPLOYMENT.md §2). If the copy
      # cannot be stored, the deploy stops here, before any migration or code change.
      - name: Store the safety export privately (production R2, not a workflow artifact)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: hashFiles('backups/*.sql') != ''
        run: |
          f="backups/pre-deploy-production-${TARGET_COMMIT}.sql"
          $WRANGLER r2 object put "crestmont-files-production/_backups/pre-deploy-production-${TARGET_COMMIT}-${{ github.run_id }}.sql" --file "$f" --remote > /dev/null
          echo "Pre-deploy export stored at r2://crestmont-files-production/_backups/pre-deploy-production-${TARGET_COMMIT}-${{ github.run_id }}.sql (sha256 $(sha256sum "$f" | cut -d' ' -f1))." >> "$GITHUB_STEP_SUMMARY"
          rm -f "$f"

      # Live payments (Founder authorization, 2026-11-12): when the committed production configuration opens checkout
      # (PAYMENTS_LIVE_AUTHORIZED = "yes"), the live Stripe setup is verified through the RUNNING Worker before anything
      # changes: GET-only calls with the Worker's own live key (balance, account, webhook endpoints; no charge, nothing
      # created). The release is refused unless the key is live, the account can take charges and the webhook endpoint
      # for PRODUCTION_URL/api/webhooks/stripe is enabled with every handled event (scripts/stripe-live-gate.ts). A
      # one-time database challenge authorizes the call (production's ops secret is known to no workflow).
      - name: Checkout state of the running release (before this deploy)
        id: before
        run: |
          state=$(curl -fsS --max-time 20 "$PRODUCTION_URL/api/health" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).payments?.checkout??"unknown")}catch{process.stdout.write("unknown")}})' || echo unknown)
          echo "checkout=$state" >> "$GITHUB_OUTPUT"
          echo "Checkout before this deploy: $state"

      - name: Live payments — verify the live Stripe account and webhook before opening checkout
        id: stripe_gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --no-warnings scripts/stripe-live-gate.ts flags wrangler.toml > flags.txt
          if ! grep -qx 'live=yes' flags.txt; then echo "Live payments stay closed in this configuration; nothing to verify."; exit 0; fi
          work=$(mktemp -d); trap 'rm -rf "$work"' EXIT
          node --no-warnings scripts/ops-challenge.ts --purpose integration_probe --out-sql "$work/c.sql" --out-nonce "$work/nonce"
          echo "::add-mask::$(cat "$work/nonce")"
          $WRANGLER d1 execute crestmont-production --remote --env production --file "$work/c.sql" --yes > /dev/null
          code=$(curl -s -o "$work/out.json" -w '%{http_code}' --max-time 60 -X POST -H 'content-type: application/json' --data "{\"challenge\":\"$(cat "$work/nonce")\"}" "$PRODUCTION_URL/api/ops/integration-probe" || echo 000)
          [ "$code" = "200" ] || { echo "::error title=Live Stripe not verified::The integration probe answered HTTP $code. Live payments were not opened; nothing was deployed."; exit 1; }
          node --no-warnings scripts/stripe-live-gate.ts check "$work/out.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      # `wrangler deploy` without --keep-vars deletes every plain-text variable added in the Cloudflare dashboard; that is
      # how the Founder's STRIPE_PUBLISHABLE_KEY vanished from staging on 2026-10-31 (docs/DEPLOYMENT.md). Staging was
      # fixed then; production was not. The deploy below keeps dashboard variables, and this guard snapshots the
      # production Worker's bindings (names and value hashes, never values) before anything on production changes and
      # proves after the deploy that none was lost (a failure there rolls the release back).
      - name: Production binding preservation — snapshot before any change
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --no-warnings scripts/staging-binding-guard.ts snapshot --env production --out guard/before.json

      - name: Apply D1 migrations (production, additive only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: $WRANGLER d1 migrations apply crestmont-production --remote --env production

      - name: Record deployment started
        env:
          EVIDENCE_INGEST_SECRET: ${{ secrets.EVIDENCE_INGEST_SECRET }}
        run: >
          node --no-warnings scripts/post-deployment.ts --id "$DEPLOYMENT_ID" --environment production --commit "$TARGET_COMMIT"
          --status started --url "$PRODUCTION_URL" --by "github-actions:${{ github.actor }}" --authorized-by deploy_pipeline
          --ci-run "gh-${{ github.run_id }}-${{ github.run_attempt }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --notes "tag ${RELEASE_TAG}"

      - name: Deploy Worker (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        id: deploy
        run: $WRANGLER deploy --env production --keep-vars --message "Release ${RELEASE_TAG} ${TARGET_COMMIT}"

      - name: Production binding preservation — verify nothing was lost
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --no-warnings scripts/staging-binding-guard.ts verify --env production --before guard/before.json

      - name: Record deployment succeeded
        env:
          EVIDENCE_INGEST_SECRET: ${{ secrets.EVIDENCE_INGEST_SECRET }}
        run: node --no-warnings scripts/post-deployment.ts --id "$DEPLOYMENT_ID" --environment production --commit "$TARGET_COMMIT" --status succeeded --by "github-actions:${{ github.actor }}"

      - name: Wait for the production URL to answer (custom-domain certificate on first release)
        run: |
          for i in $(seq 1 36); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PRODUCTION_URL/api/health" || true)
            [ "$code" = "200" ] && { echo "Production answered after $((i * 10 - 10)) s."; exit 0; }
            sleep 10
          done
          echo "::warning::$PRODUCTION_URL/api/health did not return 200 within 6 minutes; the checks below decide."

      - name: Post-deploy production checks (LAUNCH-003)
        id: checks
        run: >
          node --no-warnings scripts/production-checks.ts --base "$PRODUCTION_URL" --environment production --commit "$TARGET_COMMIT"
          --run-id "gh-${{ github.run_id }}-${{ github.run_attempt }}" --out evidence/production-check.json

      # The public smoke test (scripts/production-smoke.ts) against the release: customer access must be exactly as
      # committed (open after the public launch, closed before it). A failure rolls the release back like the checks.
      - name: Public smoke test of the live site (customer access as released)
        id: smoke
        run: |
          node --no-warnings scripts/stripe-live-gate.ts flags wrangler.toml > flags.txt
          if grep -qx 'open=yes' flags.txt; then pre=no; else pre=yes; fi
          node --no-warnings scripts/production-smoke.ts --base "$PRODUCTION_URL" --expect-prelaunch "$pre" --out evidence/production-smoke.json

      # On the release that OPENS live payments (checkout was closed before it and the configuration opens it), a
      # labelled probe customer walks every package to a live Stripe Checkout session without paying
      # (scripts/production-purchase-probe.ts). If live checkout does not work, the release is rolled back like any
      # failed check, so customers are never shown an open but broken checkout.
      # Every release with live payments: a labelled probe customer walks package → intake → review → Pay to a genuine
      # live Stripe Checkout session for Starter, Business and Premium (nothing is paid; the sessions expire).
      - name: Live purchase flow probe (every package to a live Stripe Checkout session; nothing is paid)
        id: purchase_probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! grep -qx 'live=yes' flags.txt; then echo "Live payments stay closed; no purchase probe."; exit 0; fi
          mkdir -p "$RUNNER_TEMP/review"
          BASE="$PRODUCTION_URL" D1_ENV=production EXPECT_MODE=live SAVE_REVIEW_DIR="$RUNNER_TEMP/review" node --no-warnings scripts/production-purchase-probe.ts starter,business,premium | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      # The purchase pages on the LIVE site at phone, tablet and desktop widths in a real browser (the 320px plan-card
      # fix): the public guest intake as served, and each package's review page as the probe customer received it, with
      # the live site's own stylesheets and scripts. Cosmetic: reported, never a rollback.
      - name: Live layout of the purchase pages (320 px to desktop)
        if: always() && steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.pw/node_modules/playwright/index.mjs
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw/browsers
        run: |
          npm install --prefix .pw --no-save --no-audit --no-fund --ignore-scripts playwright@1.48.2 > /dev/null
          .pw/node_modules/.bin/playwright install --with-deps chromium > /dev/null
          node scripts/live-layout-check.mjs "$PRODUCTION_URL" "$RUNNER_TEMP/review" | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}; rm -rf "$RUNNER_TEMP/review"; exit "$rc"

      - name: Production data report (read-only; no personal data)
        if: always() && steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --no-warnings scripts/production-data-report.ts | tee -a "$GITHUB_STEP_SUMMARY"

      # Criterion 5 (2026-11-13): backups that need no approval. The production Worker writes a full dump of its database
      # to its own private bucket every day (Cron Trigger, src/services/db-backup.ts). Here the deploy asks the new
      # Worker for one now (one-time database challenge), downloads it, checks its sha256 against the manifest,
      # rehearses it locally with foreign keys enforced, restores it into a throw-away D1 database, compares every
      # table's row count, and deletes the scratch database. Production is only read. Nothing from the dump is printed
      # (the repository is public): failures name the stage and an error code only. A failed drill is reported loudly
      # but does not roll back a release that passed its checks.
      - name: Automated backup — fresh Worker backup restored into an isolated scratch database
        id: backup_drill
        if: always() && steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCRATCH: crestmont-backup-drill-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          work=$(mktemp -d)
          created=no
          cleanup() { [ "$created" = yes ] && { $WRANGLER d1 delete "$SCRATCH" --skip-confirmation > /dev/null 2>&1 || $WRANGLER d1 delete "$SCRATCH" -y > /dev/null 2>&1 || echo "::warning::Scratch database $SCRATCH could not be deleted automatically; delete it in the Cloudflare dashboard."; }; rm -rf "$work"; }
          trap cleanup EXIT
          fail() { code=$(sed -e 's/\x1b\[[0-9;]*m//g' "$work/err.log" 2>/dev/null | grep -oE 'code: ?[0-9]+|SQLITE_[A-Z_]+|HTTP [0-9]{3}' | head -1); echo "::error title=Backup restore drill failed::Stage: $1${code:+ ($code)}. The release itself is live and unaffected."; echo "**Backup restore drill: FAILED at $1${code:+ ($code)}.**" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          node --no-warnings scripts/ops-challenge.ts --purpose database_backup --out-sql "$work/c.sql" --out-nonce "$work/nonce" > /dev/null
          echo "::add-mask::$(cat "$work/nonce")"
          $WRANGLER d1 execute crestmont-production --remote --env production --file "$work/c.sql" --yes > /dev/null 2> "$work/err.log" || fail "write challenge"
          http=$(curl -s -o "$work/manifest.json" -w '%{http_code}' --max-time 120 -X POST -H 'content-type: application/json' --data "{\"challenge\":\"$(cat "$work/nonce")\"}" "$PRODUCTION_URL/api/ops/database-backup" || echo 000)
          [ "$http" = "200" ] || { echo "HTTP $http" > "$work/err.log"; fail "Worker backup"; }
          key=$(node -e 'const m=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!/^_backups\/daily\/\d{4}-\d{2}-\d{2}\.sql$/.test(m.key)) process.exit(1); console.log(m.key)' "$work/manifest.json") || fail "manifest"
          $WRANGLER r2 object get "crestmont-files-production/$key" --file "$work/dump.sql" --remote > /dev/null 2> "$work/err.log" || fail "download from R2"
          node -e 'const fs=require("fs"),c=require("crypto");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const d=fs.readFileSync(process.argv[2]);const h=c.createHash("sha256").update(d).digest("hex");if(h!==m.sha256||d.length!==m.bytes){console.error("sha256 or size differs from the manifest");process.exit(1)}fs.writeFileSync(process.argv[3],JSON.stringify([{results:Object.keys(m.tables).map(name=>({name}))}]))' "$work/manifest.json" "$work/dump.sql" "$work/tables.json" 2> "$work/err.log" || fail "sha256 check"
          node --no-warnings scripts/restore-drill.ts export-counts "$work/dump.sql" > "$work/source.json" 2> "$work/err.log" || fail "count dump rows"
          node --no-warnings scripts/restore-drill.ts sanitize "$work/dump.sql" "$work/import.sql" > /dev/null 2> "$work/err.log" || fail "prepare import"
          node --no-warnings scripts/restore-drill.ts rehearse "$work/dump.sql" "$work/import.sql" "$work/reference.json" > "$work/rehearse.log" 2> "$work/err.log" || fail "local rehearsal"
          node --no-warnings scripts/restore-drill.ts sql "$work/tables.json" > "$work/count.sql"
          $WRANGLER d1 create "$SCRATCH" > /dev/null 2> "$work/err.log" || fail "create scratch database"
          created=yes
          $WRANGLER d1 execute "$SCRATCH" --remote --file "$work/import.sql" --yes > /dev/null 2> "$work/err.log" || fail "restore into scratch database"
          i=0; files=""
          while IFS= read -r q; do [ -n "$q" ] || continue
            $WRANGLER d1 execute "$SCRATCH" --remote --json --command "$q" > "$work/restored-$i.json" 2> "$work/err.log" || fail "count restored rows"
            files="$files${files:+,}$work/restored-$i.json"; i=$((i+1))
          done < "$work/count.sql"
          $WRANGLER d1 execute "$SCRATCH" --remote --json --command "PRAGMA foreign_key_check" > "$work/fk.json" 2> "$work/err.log" || fail "foreign_key_check"
          $WRANGLER d1 execute "$SCRATCH" --remote --json --command "$(node --no-warnings scripts/restore-drill.ts objects-sql)" > "$work/objects.json" 2> "$work/err.log" || fail "schema objects"
          content=""
          while IFS=$'\t' read -r t q; do [ -n "$t" ] || continue
            $WRANGLER d1 execute "$SCRATCH" --remote --json --command "$q" > "$work/content-$t.json" 2> "$work/err.log" || fail "read restored $t"
            content="$content${content:+,}$t=$work/content-$t.json"
          done < <(node --no-warnings scripts/restore-drill.ts content-sql "$work/reference.json")
          mkdir -p evidence
          result=$(node --no-warnings scripts/restore-drill.ts compare "$work/source.json" "$files" --reference "$work/reference.json" --fk "$work/fk.json" --objects "$work/objects.json" --content "$content" \
            --commit "$TARGET_COMMIT" --run-id "gh-${{ github.run_id }}-${{ github.run_attempt }}-backup-drill" --out evidence/backup-restore-drill.json 2> "$work/err.log") || { echo "$result" | cut -c1-400 >> "$GITHUB_STEP_SUMMARY"; fail "row-count comparison"; }
          summary=$(node -e 'const m=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(`${m.key} (${m.bytes} bytes, sha256 ${m.sha256.slice(0,16)}…, ${m.totalRows} rows in ${Object.keys(m.tables).length} tables, written ${m.createdAt})`)' "$work/manifest.json")
          echo "**Backup restore drill: PASSED.** Automated Worker backup $summary restored into the isolated database $SCRATCH: $result" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Running Worker's AI website generation matches the released configuration
        id: gate
        run: |
          curl -fsS --max-time 20 "$PRODUCTION_URL/api/health" -o health.json
          node --no-warnings scripts/phase-check.ts live wrangler.toml health.json --exact

      - name: Post production_check evidence
        env:
          EVIDENCE_INGEST_SECRET: ${{ secrets.EVIDENCE_INGEST_SECRET }}
        if: always() && steps.deploy.outcome == 'success'
        run: node --no-warnings scripts/post-evidence.ts evidence/production-check.json

      - name: Record verification passed
        env:
          EVIDENCE_INGEST_SECRET: ${{ secrets.EVIDENCE_INGEST_SECRET }}
        if: steps.checks.outcome == 'success'
        run: node --no-warnings scripts/post-deployment.ts --id "$DEPLOYMENT_ID" --environment production --commit "$TARGET_COMMIT" --status succeeded --verification passed --by "github-actions:${{ github.actor }}"

      - name: Roll back on failed production checks
        env:
          EVIDENCE_INGEST_SECRET: ${{ secrets.EVIDENCE_INGEST_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "::error title=Rolling back::Production checks failed for $TARGET_COMMIT. Rolling back the Worker to the previous version."
          $WRANGLER rollback --env production --message "Automatic rollback: post-deploy checks failed for ${TARGET_COMMIT}" --yes
          node --no-warnings scripts/post-deployment.ts --id "$DEPLOYMENT_ID" --environment production --commit "$TARGET_COMMIT" --status rolled_back --verification failed --by "github-actions:${{ github.actor }}" \
            --notes "Rolled back by deploy-production.yml after failed post-deploy checks. Database migrations are NOT rolled back (BACKUP-RECOVERY §5)."
          echo "Open a production_incident blocker at /staff/readiness/blockers and follow docs/RUNBOOK.md §3 and §10."
          # CREST-GAP-068: on the FIRST release (empty database marker from the safety-export step) the "previous version"
          # is the empty draft Worker from provision-production.yml, so this rollback restores "not launched", not a working
          # site. That is intended (failed code never keeps serving), but it is an outage of the new domain, not a recovery.
          if [ -f backups/EMPTY-DATABASE.txt ]; then
            echo "::warning title=First release rolled back::The custom domain now serves the empty draft Worker (the site is not live). Fix forward with a new release candidate; see docs/RUNBOOK.md §3.1 (first release)."
            echo "First release: rolled back to the empty draft Worker. The domain answers but the site is not live; fix forward (docs/RUNBOOK.md §3.1)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record failed deployment
        env:
          EVIDENCE_INGEST_SECRET: ${{ secrets.EVIDENCE_INGEST_SECRET }}
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          node --no-warnings scripts/post-deployment.ts --id "$DEPLOYMENT_ID" --environment production --commit "$TARGET_COMMIT" --status failed --by "github-actions:${{ github.actor }}" || true
          echo "::error::wrangler deploy failed; the previous Worker version is still serving. If migrations were applied, they are additive (docs/BACKUP-RECOVERY.md §5)."
