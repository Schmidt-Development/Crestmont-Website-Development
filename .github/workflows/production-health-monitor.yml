name: Production health monitor

# CREST-GAP-015 / INFRA-006: the production twin of staging-health-monitor.yml. Probes the public production health
# endpoints from GitHub's infrastructure (outside Cloudflare) on a 30-minute cron that GitHub does not honour (the
# staging twin measures about 4 runs a day; see its "Schedule reality" note), three attempts a minute apart, and fails
# loudly. A failed run is the alert: GitHub emails the account that last changed this schedule and anyone watching the
# repository's Actions ("Actions: failed workflows" must be on in that account's notification settings).
#
# Reads only public endpoints and uses NO secret. It deliberately does not use the `production` environment: that
# environment has required reviewers, which would pause every scheduled run for approval. The URL therefore comes from
# the REPOSITORY variable PRODUCTION_URL (Settings → Secrets and variables → Actions → Variables → Repository). Until that
# variable exists (production not launched), every run skips cleanly with a notice.
#
# WHY THE URL IS NOT ENOUGH. PRODUCTION_URL has to be set BEFORE the first deployment, because
# deploy-production.yml refuses to start without it ("Refuse unless production is provisioned"). So between setting the
# variable and the first successful deploy there is a window — hours or days, and it includes the Founder approval —
# in which the domain does not resolve and this monitor would fail every run: roughly 48 alerts a day, all of them
# saying only "not launched yet". An alert channel that cries wolf before launch is not watched after it.
#
# So the real question is whether production has ever been DEPLOYED, and this asks it directly: has
# deploy-production.yml ever completed successfully? Before the first deploy, every run skips with a notice. From the
# first successful deploy onwards the gate is permanently open and the probe runs at full strength — nothing is
# weakened, and there is no "launched" flag anyone has to remember to flip.
on:
  schedule:
    - cron: "26,56 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Read-only, and only to ask that one question. Not a secret: github.token, scoped to this repository.
  actions: read

concurrency:
  group: production-health-monitor
  cancel-in-progress: true

jobs:
  probe:
    if: github.ref == 'refs/heads/main'   # main only (see deploy-staging.yml)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Skip until production has a URL and has actually been deployed
        id: pre
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_WORKFLOW: deploy-production.yml
        run: |
          if [ -z "$BASE" ]; then
            echo "::notice title=Production health monitor skipped::The repository variable PRODUCTION_URL is not set (production not launched). Nothing was probed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif ! printf '%s' "$BASE" | grep -Eq '^https://[A-Za-z0-9.-]+$'; then
            echo "::error title=PRODUCTION_URL invalid::PRODUCTION_URL must be a bare https origin such as https://crestmontwebsitedevelopment.com"
            exit 1
          elif ! deploys=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$DEPLOY_WORKFLOW/runs?status=success&per_page=1" --jq ".total_count"); then
            # A lookup that FAILED must never read as "nothing is deployed" — that is how monitoring goes quiet on the
            # day it is needed. Probe, and say in the run why the gate was skipped rather than trusted.
            echo "::warning title=Could not confirm a production deployment::The Actions API did not answer, so the launch gate could not be read. Probing anyway: a failed lookup must not hide a real outage."
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif ! printf '%s' "$deploys" | grep -Eq '^[0-9]+$'; then
            echo "::warning title=Could not confirm a production deployment::The Actions API returned '$deploys', which is not a count. Probing anyway: a failed lookup must not hide a real outage."
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "$deploys" -eq 0 ]; then
            echo "::notice title=Production health monitor skipped::PRODUCTION_URL is set, but $DEPLOY_WORKFLOW has never completed successfully, so nothing is deployed at $BASE yet. Nothing was probed. This gate opens by itself on the first successful production deployment."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Service and evidence-feed health (retries before alerting)
        if: steps.pre.outputs.ok == 'true'
        run: |
          fail=""
          for attempt in 1 2 3; do
            fail=""
            app=$(curl -s -o /tmp/app.json -w '%{http_code}' --max-time 20 "$BASE/api/health" || echo 000)
            feeds=$(curl -s -o /tmp/feeds.json -w '%{http_code}' --max-time 20 "$BASE/api/readiness/health" || echo 000)
            [ "$app" = "200" ] || fail="$fail /api/health=$app"
            [ "$feeds" = "200" ] || fail="$fail /api/readiness/health=$feeds"
            [ -z "$fail" ] && break
            sleep 60
          done
          {
            echo "### Production health $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "- /api/health: $app"
            echo "- /api/readiness/health: $feeds"
            echo '```json'; cat /tmp/feeds.json 2>/dev/null | head -c 4000; echo; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$fail" ]; then echo "::error title=Production unhealthy::$fail (after 3 attempts)"; exit 1; fi

      # Phased launch (docs/PHASED-LAUNCH.md): a Worker secret can switch AI website generation on without any deploy or
      # release check. Compare what the running Worker reports with the committed configuration on main; only a Worker
      # MORE open than committed fails (a reviewed reopening waits for its deploy without raising an alarm).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: always() && steps.pre.outputs.ok == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: always() && steps.pre.outputs.ok == 'true'
        with:
          node-version: "22.x"
      - name: AI website generation is not open beyond the committed configuration
        if: always() && steps.pre.outputs.ok == 'true'
        run: node --no-warnings scripts/phase-check.ts live wrangler.toml /tmp/app.json
