name: Release

# INFRA-005: release tagging. Pushing a tag v* creates a GitHub release with generated notes and,
# when the readiness API is reachable, a release candidate bound to the tag's full commit SHA and the
# wrangler.toml digest. Nothing here deploys anything or approves anything: the Founder reviews the
# candidate at /staff/readiness/approve and only then may deploy-production.yml run.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "## ${TAG}"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Configuration (wrangler.toml) SHA-256: \`$(node --no-warnings scripts/release-candidate.ts --print-config-digest)\`"
            echo
            echo "### Changes${prev:+ since ${prev}}"
            git log --no-merges --pretty='- %s (%h)' ${prev:+${prev}..}"${TAG}"
            echo
            echo "### Production"
            echo "This tag is a release candidate only. Production deploys require the Founder's approval of this exact commit at /staff/readiness/approve, then a manual run of the *Deploy production* workflow."
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md --prerelease

      - name: Create release candidate in the readiness system
        env:
          READINESS_URL: ${{ vars.READINESS_URL }}
          EVIDENCE_INGEST_SECRET: ${{ secrets.EVIDENCE_INGEST_SECRET }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$READINESS_URL" ] || [ -z "$EVIDENCE_INGEST_SECRET" ]; then
            echo "::notice title=Release candidate not recorded::READINESS_URL / EVIDENCE_INGEST_SECRET not configured (no deployed readiness system yet, BLK-003). Create the candidate at /staff/readiness/releases once it exists."
            exit 0
          fi
          node --no-warnings scripts/release-candidate.ts --tag "$TAG" --commit "$GITHUB_SHA" --notes-file release-notes.md \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
