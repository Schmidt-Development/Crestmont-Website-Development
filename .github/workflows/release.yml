name: Release

# INFRA-005: release tagging. Pushing a tag v* creates a GitHub release with generated notes and,
# when the readiness API is reachable, a release candidate bound to the tag's full commit SHA and the
# wrangler.toml digest. Nothing here deploys anything or approves anything: the Founder reviews the
# candidate at /staff/readiness/approve and only then may deploy-production.yml run.

on:
  push:
    tags: ["v*"]
  # The same release, started by hand for a commit already on main: the workflow creates the tag itself (with the
  # job's own token, which starts no further workflow run) and then does exactly what a tag push does. For sessions
  # and operators that can run workflows but cannot push tags. It still approves and deploys nothing.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v1.0.0"
        required: true
        type: string
      commit:
        description: "Full 40-character SHA of the commit on main to release"
        required: true
        type: string

permissions:
  contents: write   # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # F-23: free-text input reaches scripts only through these variables, never interpolated into `run:`.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
    steps:
      - name: Validate the release inputs
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::tag must look like v1.2.3 or v1.2.3-rc.1"; exit 1; }
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be the full 40-character lowercase SHA"; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0

      - name: Create the tag on a commit that is on main (manual release only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          [ "$(git rev-parse HEAD)" = "$RELEASE_COMMIT" ] || { echo "::error::checked-out HEAD is not $RELEASE_COMMIT"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main || { echo "::error::$RELEASE_COMMIT is not on main. Only reviewed commits on main can be released."; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::tag $TAG already exists; choose a new version (an existing tag is never moved)"; exit 1
          fi
          git tag "$TAG" "$RELEASE_COMMIT"
          git push origin "refs/tags/$TAG"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "## ${TAG}"
            echo
            echo "Commit: \`${RELEASE_COMMIT}\`"
            echo "Configuration (wrangler.toml) SHA-256: \`$(node --no-warnings scripts/release-candidate.ts --print-config-digest)\`"
            echo
            echo "### Changes${prev:+ since ${prev}}"
            git log --no-merges --pretty='- %s (%h)' ${prev:+${prev}..}"${TAG}"
            echo
            echo "### Production"
            echo "This tag is a release candidate only. Production deploys require the Founder's approval of this exact commit at /staff/readiness/approve, then a manual run of the *Deploy production* workflow."
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md --prerelease

      - name: Create release candidate in the readiness system
        env:
          READINESS_URL: ${{ vars.READINESS_URL }}
          EVIDENCE_INGEST_SECRET: ${{ secrets.EVIDENCE_INGEST_SECRET }}
        run: |
          if [ -z "$READINESS_URL" ] || [ -z "$EVIDENCE_INGEST_SECRET" ]; then
            echo "::notice title=Release candidate not recorded::READINESS_URL / EVIDENCE_INGEST_SECRET not configured (no deployed readiness system yet, BLK-003). Create the candidate at /staff/readiness/releases once it exists."
            exit 0
          fi
          node --no-warnings scripts/release-candidate.ts --tag "$TAG" --commit "$RELEASE_COMMIT" --notes-file release-notes.md \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
