name: Build queue verification (deployed staging, browser)

# Does submitting six finished frontends really put four builds on Node 1 and leave two waiting?
#
# The in-process tests prove the claim and the screen agree on who is next, and that a full node queues the rest,
# against an in-memory database with a fake runner. They cannot say whether the deployed site, the real scanner, the
# real import worker and a real four-slot runner behave that way together, or whether a released slot is picked up
# with nobody pressing anything. tests/e2e/staging-build-queue.e2e.ts does, in a browser, against the deployed site.
#
# Dispatch-only, so it runs against staging as it stands without redeploying.
#
# It writes: E2E_QUEUE_FIXTURES projects (default 6) in the internal "Artifact Builder tests" organization, each
# named with the run id, and one disposable archive generated by the test uploaded to each. The Founder's own test
# artifacts are never submitted, read or altered. The demo-account credentials are re-derived rather than rotated
# (ACCESS_EPOCH 3, ROTATE unset), so the sealed access artifact stays valid, and the credential files are removed
# even when the run fails.
#
# Long by nature: six archives are each scanned on the operational scanner's own poll, then imported and measured
# by Node 1, and four backend builds then run on one GPU. The timeout is the test's own patience plus room.
on:
  workflow_dispatch:
    inputs:
      fixtures:
        description: "How many disposable frontends to submit (more than the four-slot cap, so the queue is not empty)"
        type: string
        default: "6"

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    # Job-level, after the `if:` (CREST-NEW-007): GitHub keeps one pending run per concurrency group and a run that
    # never starts a job still holds the slot. A skipped job never enters the group.
    concurrency:
      group: deploy-staging   # it applies access SQL and writes staging rows
      cancel-in-progress: false
    env:
      WRANGLER: npx --yes wrangler@4.149.0
      STAGING_URL: ${{ vars.STAGING_URL || 'https://crestmont-platform-staging.partners-df4.workers.dev' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"

      # The Cloudflare token lives on the steps that need it, never at job level: the browser step below runs
      # third-party packages and must not hold it (F-24, tests/workflow-security.test.ts).
      - name: Resolve the staging D1 database id (same injection as deploy-staging.yml, CREST-GAP-065)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$($WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).find(d=>d.name==="crestmont-staging");process.stdout.write(r?r.uuid:"")})')
          [ -n "$id" ] || { echo "::error::The crestmont-staging D1 database was not found."; exit 1; }
          node -e 'const fs=require("fs");let t=fs.readFileSync("wrangler.toml","utf8");t=t.replace(/(database_name = "crestmont-staging", database_id = )""/, `$1"${process.argv[1]}"`);fs.writeFileSync("wrangler.toml",t)' "$id"
          grep -q "$id" wrangler.toml && echo "Staging D1: $id"

      - name: Report the deployed cap and what Node 1 is doing before the run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $WRANGLER d1 execute crestmont-staging --remote --env staging --json \
            --command "SELECT max_concurrent FROM build_settings WHERE id = 1" | tee cap.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("cap.json","utf8"));const n=r[0]?.results?.[0]?.max_concurrent;console.log(`deployed cap: ${n}`);if(Number(n)!==4){console.log("::error title=Build queue::the deployed cap is not four; migration 0092 has not been applied to this database");process.exit(1)}'
          $WRANGLER d1 execute crestmont-staging --remote --env staging --json \
            --command "SELECT state, COUNT(*) AS n FROM build_jobs GROUP BY state" | tee before.json
          echo "Builds before this run: $(node -e 'const r=JSON.parse(require("fs").readFileSync("before.json","utf8"));console.log((r[0]?.results??[]).map(x=>`${x.state} ${x.n}`).join(", ")||"none")')"

      - name: Apply staging access (same epoch, no rotation, so the same derived passwords)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCESS_EPOCH: "3"
          MFA_ENCRYPTION_KEY: ${{ secrets.STAGING_MFA_ENCRYPTION_KEY }}
        run: node --no-warnings scripts/staging-access.ts --url "$STAGING_URL" --out access

      - name: Submit the fixtures and watch the queue through the deployed interface
        env:
          E2E_BASE_URL: ${{ vars.STAGING_URL || 'https://crestmont-platform-staging.partners-df4.workers.dev' }}
          E2E_ACCOUNTS_FILE: access/demo-accounts.md
          E2E_QUEUE_FIXTURES: ${{ inputs.fixtures }}
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.pw/node_modules/playwright/index.mjs
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw/browsers
        run: |
          npm install --prefix .pw --no-save --no-audit --no-fund --ignore-scripts playwright@1.48.2 > /dev/null
          .pw/node_modules/.bin/playwright install --with-deps chromium > /dev/null
          rc=0
          node --no-warnings --test --test-concurrency=1 tests/e2e/staging-build-queue.e2e.ts 2>&1 | tee queue-e2e.log || rc=$?
          # A SKIPPED check is UNDETERMINED, and this run exists to determine something. node:test exits 0 when a
          # test skips itself, so the first run of this workflow finished GREEN while reporting
          #   [AB-Q-02] ... # SKIP only 0 of 6 fixtures had reached the queue within 45 minutes
          # A verification that cannot say the four-slot queue works must not look like one that said it does.
          skipped=$(grep -cE '^ok [0-9]+ - .* # SKIP' queue-e2e.log || true)
          if [ "${skipped:-0}" -gt 0 ]; then
            echo "::error title=Build queue::${skipped} check(s) could not be determined, which is not a pass:"
            grep -E '^ok [0-9]+ - .* # SKIP' queue-e2e.log | cut -c1-400
            rc=1
          fi
          exit $rc

      # The timeline, not a snapshot.
      #
      # A snapshot can only see four builds at once while builds OUTLAST the interval at which they arrive. The
      # first run of this workflow measured six design-locked builds that each stopped in thirteen seconds for
      # want of a contract, so the four slots were never full at one instant and the snapshot check could say
      # nothing -- while the records showed six builds queued automatically and each slot taking the next one.
      # The timeline answers both questions the Founder asked, whatever a build's duration: was the cap ever
      # exceeded, and did a waiting build start when a slot was released.
      - name: The build timeline, and whether the cap ever broke (evidence, whatever the result)
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $WRANGLER d1 execute crestmont-staging --remote --env staging --json \
            --command "SELECT j.id, j.state, j.state_reason, j.stop_reason, p.name, j.created_at, j.run_started_at, j.finished_at, j.lease_runner FROM build_jobs j JOIN projects p ON p.id = j.project_id ORDER BY j.created_at DESC LIMIT 40" | tee after.json
          node -e '
            const rows = (JSON.parse(require("fs").readFileSync("after.json","utf8"))[0]?.results ?? []);
            for (const x of rows.slice().reverse()) {
              console.log([x.state, x.name, "created " + x.created_at, "started " + (x.run_started_at || "-"), "finished " + (x.finished_at || "-"), x.lease_runner || "-", String(x.stop_reason || x.state_reason || "").slice(0, 160)].join("  |  "));
            }
            // Overlap: every build with a start is an interval [started, finished or now). The cap is broken if
            // more than four overlap at any instant, and an interval can only BEGIN to overlap when one begins,
            // so checking at every start is enough.
            // One line, and not called `name`: a line beginning `name: ` inside a block scalar trips the
            // workflow guard that looks for an unquoted colon-space in a step name ([SEC-007]).
            const live = rows.filter((x) => x.run_started_at).map((x) => ({ project: x.name, from: Date.parse(x.run_started_at), to: x.finished_at ? Date.parse(x.finished_at) : Date.now() }));
            let peak = 0, at = null, who = [];
            for (const s of live) {
              const together = live.filter((o) => o.from <= s.from && o.to > s.from);
              if (together.length > peak) { peak = together.length; at = new Date(s.from).toISOString(); who = together.map((o) => o.project); }
            }
            console.log("");
            console.log("most builds active at one instant: " + peak + (at ? " at " + at : ""));
            if (peak) console.log("  " + who.join(", "));
            if (peak > 4) { console.log("::error title=Build queue::the four-slot cap was exceeded"); process.exit(1); }
            console.log("the cap held: " + peak + " of 4 at the busiest instant across " + live.length + " started build(s)");
          '

      - name: Remove the credential files
        if: always()
        run: rm -f access/private.json access/access.json access/demo-accounts.md access/README.md
