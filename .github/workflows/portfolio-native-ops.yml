name: Portfolio native onboarding (production)

# Native readiness operations on production (Owner, 2026-11-19), through the production Worker itself — the only place
# the provider connections (PORTFOLIO_CLOUDFLARE_TOKEN / PORTFOLIO_VERCEL_TOKEN / PORTFOLIO_GITHUB_TOKEN, Worker
# secrets) exist. Runs only from main, in the `production` environment (the Owner approves each run).
#   check    read-only: which accounts, zones, projects, domains and repositories each connection authorizes, the
#            permissions it lacks, and for each address its framing answer and the connected account that serves it.
#            Nothing is created or changed anywhere.
#   onboard  the controlled onboarding of ONE owned website, exactly as Staff → Portfolio → Add: unpublished; Crestmont
#            prepares only its public pages through the connection that serves it (a protected repository waits for
#            the Owner's merge), follows the deployment, verifies it in a real browser, then this job opens the preview
#            and checks it in Chromium (native frame, content, scrolling, animation, phone width, no remote browser,
#            protected pages refused). Nothing is published; no consent or relationship is recorded.
#   status   read-only: the entry's native state and audit trail from the production database, and the live site's
#            framing headers on its homepage and protected pages. Nothing is called on the Worker, nothing changes.
#   resume   continue an existing onboarding entry (slug) where it is — one ordinary step at a time, never forced, so an
#            existing rule is reused (never duplicated) and a rolled-back one is not re-applied — then the same browser
#            check once it is verified.
# Each Worker request uses a one-time challenge (src/services/ops-challenge.ts) through scripts/native-ops-ask.sh, which
# writes the HTTP status to a file and masks the challenge on the job's own output (production run 44456707770 captured
# the mask command together with the status). No token value is ever printed.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "check (read-only), status (read-only), onboard (one website) or resume (an existing entry)"
        required: true
        type: choice
        options: [check, status, onboard, resume]
      url:
        description: "onboard: the website's production address (https://…)"
        required: false
        type: string
      urls:
        description: "check: addresses to discover (comma-separated; empty = the portfolio's sites and the test candidates)"
        required: false
        type: string
      slug:
        description: "status / resume: the portfolio entry's slug (e.g. lending-for-beginners)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: portfolio-native-ops
  cancel-in-progress: false

jobs:
  native:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      WRANGLER: npx --yes wrangler@4.149.0
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      ACTION: ${{ inputs.action }}
      URL_INPUT: ${{ inputs.url }}
      URLS_INPUT: ${{ inputs.urls }}
      SLUG_INPUT: ${{ inputs.slug }}
    steps:
      - name: Validate inputs (F-23)
        run: |
          [[ "$ACTION" =~ ^(check|status|onboard|resume)$ ]] || { echo "::error::action must be check, status, onboard or resume"; exit 1; }
          [[ -z "$SLUG_INPUT" || "$SLUG_INPUT" =~ ^[a-z0-9][a-z0-9-]{0,79}$ ]] || { echo "::error::slug must be lowercase letters, digits and dashes"; exit 1; }
          [[ ! "$ACTION" =~ ^(status|resume)$ || -n "$SLUG_INPUT" ]] || { echo "::error::$ACTION needs slug"; exit 1; }
          [[ -z "$URL_INPUT" || "$URL_INPUT" =~ ^https://[A-Za-z0-9.-]+(/[A-Za-z0-9/._~-]*)?$ ]] || { echo "::error::url must be a plain https address"; exit 1; }
          [[ -z "$URLS_INPUT" || "$URLS_INPUT" =~ ^(https://[A-Za-z0-9.-]+/?)(,[[:space:]]*https://[A-Za-z0-9.-]+/?){0,11}$ ]] || { echo "::error::urls must be up to 12 comma-separated https origins"; exit 1; }
          [[ "$ACTION" != "onboard" || -n "$URL_INPUT" ]] || { echo "::error::onboard needs url"; exit 1; }
          [ -n "$PRODUCTION_URL" ] || { echo "::error::PRODUCTION_URL (var) is not set"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
      - name: Production state (read-only — database, Crestmont's rule and the live site's headers)
        id: state
        if: inputs.action == 'status' || inputs.action == 'resume'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          work=$(mktemp -d); trap 'rm -rf "$work"' EXIT
          q() { $WRANGLER d1 execute crestmont-production --remote --env production --json --command "$1" > "$work/$2.json" 2> /dev/null || echo '[{"results":[]}]' > "$work/$2.json"; }
          q "SELECT id, slug, live_url, embed_url, published, native_required, native_state, native_reason, native_provider, native_change, native_verified_at, native_updated_at, substr(native_verification, 1, 1500) AS native_verification, archived_at FROM portfolio_projects WHERE slug = '$SLUG_INPUT'" project
          q "SELECT a.created_at, a.actor_kind, a.action, substr(a.details_json, 1, 600) AS details FROM audit_logs a JOIN portfolio_projects p ON p.id = a.subject_id WHERE p.slug = '$SLUG_INPUT' AND a.action LIKE 'portfolio.%' ORDER BY a.created_at DESC LIMIT 30" audit
          node scripts/native-ops-report.mjs status "$work/project.json" "$work/audit.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Ask the production Worker (one-time challenges)
        id: ops
        if: inputs.action != 'status'
        env:
          LIVE_FROM_STATE: ${{ steps.state.outputs.live }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          work=$(mktemp -d); trap 'rm -rf "$work"' EXIT
          # scripts/native-ops-ask.sh never writes the status to stdout: it is read from r.json.status.
          ask() { bash scripts/native-ops-ask.sh "$1" "$work/r.json"; http=$(cat "$work/r.json.status"); }
          answer() { head -c 400 "$work/r.json" 2>/dev/null | tr -d '\r' | tr '\n' ' '; }
          if [ "$ACTION" = "check" ]; then
            urls="${URLS_INPUT:-https://leadhavencollective.com/, https://geteveryinvoicepaid.com/, https://betterlansingmechanics.com/, https://glasslyautoglass.com/, https://lansingcarrentals.com/, https://mentorship.lansingcarrentals.com/, https://lendingforbeginners.com/, https://premiuminvoices.com/}"
            ask "$(node -e 'console.log(JSON.stringify({ action: "check", urls: process.argv[1].split(",").map((s) => s.trim()).filter(Boolean) }))' "$urls")"
            [ "$http" = "200" ] || { echo "::error::check HTTP $http: $(answer)"; exit 1; }
            node scripts/native-ops-report.mjs check "$work/r.json" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$ACTION" = "onboard" ]; then
            ask "$(node -e 'console.log(JSON.stringify({ action: "onboard", url: process.argv[1] }))' "$URL_INPUT")"
            [ "$http" = "200" ] || { echo "::error::onboard HTTP $http: $(answer)"; exit 1; }
          else
            ask "$(node -e 'console.log(JSON.stringify({ action: "advance", slug: process.argv[1] }))' "$SLUG_INPUT")"
            [ "$http" = "200" ] || { echo "::error::resume HTTP $http: $(answer)"; exit 1; }
          fi
          node scripts/native-ops-report.mjs step "$work/r.json" | tee -a "$GITHUB_STEP_SUMMARY"
          field() { node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(r[process.argv[2]]??"")' "$work/r.json" "$1"; }
          slug=$(field slug); live="${LIVE_FROM_STATE:-$URL_INPUT}"
          # Follow it (the 15-minute job would too): up to 45 minutes, one ordinary step a minute, until it settles.
          for i in $(seq 1 45); do
            case "$(field state)" in native_verified|authorization_required|unavailable) break ;; esac
            sleep 60
            ask "$(node -e 'console.log(JSON.stringify({ action: "advance", slug: process.argv[1] }))' "$slug")"
            [ "$http" = "200" ] || { echo "::warning::advance HTTP $http"; continue; }
            node scripts/native-ops-report.mjs step "$work/r.json" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          { echo "state=$(field state)"; echo "preview=$(field preview)"; echo "live=$live"; } >> "$GITHUB_OUTPUT"
      - name: Install Chromium (pinned Playwright)
        if: steps.ops.outputs.preview != ''
        run: |
          npm install --prefix .pw --no-save --no-audit --no-fund --ignore-scripts playwright@1.48.2 > /dev/null
          .pw/node_modules/.bin/playwright install --with-deps chromium > /dev/null
      - name: The real website in Crestmont's native frame — content, scrolling, animation, phone width, no remote browser
        if: steps.ops.outputs.preview != ''
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.pw/node_modules/playwright/index.mjs
          PREVIEW: ${{ steps.ops.outputs.preview }}
          LIVE: ${{ steps.ops.outputs.live }}
        run: |
          set -o pipefail
          node scripts/native-onboard-check.mjs "$PRODUCTION_URL$PREVIEW" "$LIVE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Outcome
        if: always()
        env:
          STATE: ${{ steps.ops.outputs.state }}
        run: |
          [[ "$ACTION" =~ ^(check|status)$ ]] && exit 0
          echo "Native state: ${STATE:-unknown}"
          [ "$STATE" = "native_verified" ] || { echo "::warning title=Not verified yet::${STATE:-unknown} — see the steps above for the exact reason and what is needed."; }
