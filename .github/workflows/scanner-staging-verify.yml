name: Scanner staging verification (real upload, remote scanner)

# Proves the DEPLOYMENT, not the code: a demo customer uploads two harmless files and the EICAR test file through the
# real portal, and the scanner that is already serving this platform -- the operational one on Node 1 -- claims them
# from the platform's own queue and reports signed verdicts. This job runs no scanner of its own; it waits for the
# rows and then checks them (E2E_REMOTE_SCANNER=1, scripts/scanner-staging-e2e.ts).
#
# A file still 'pending' at the deadline fails the run. Nothing here can label an unscanned file clean.
#
# Staging only, no code deployed. It writes this run's own files and removes them, and re-applies the demo-account
# credentials exactly as the deploy does -- ACCESS_EPOCH 3 with ROTATE unset, which reuses the stored salt and so
# re-derives the SAME passwords (scripts/staging-access.ts). It does not rotate, and the Founder's sealed access
# artifact from the last deploy stays valid. The credential files are deleted even when the run fails.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    # Job-level, after `if:` (CREST-NEW-007): GitHub keeps ONE pending run per concurrency group, so a run
    # that never starts a job still holds the slot. At workflow level it did exactly that here -- the synthetic
    # failed `push` run GitHub creates for an unparseable workflow took the slot and a dispatched run sat
    # `pending` behind it for fifteen minutes. A skipped job never enters the group.
    concurrency:
      group: deploy-staging   # applies access SQL and writes staging files
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_ROOT_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCESS_EPOCH: "3"                 # the same epoch deploy-staging.yml uses: no rotation
      WRANGLER: npx --yes wrangler@4.149.0
      STAGING_URL: ${{ vars.STAGING_URL || 'https://crestmont-platform-staging.partners-df4.workers.dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"

      - name: Resolve the staging D1 database id (same injection as deploy-staging.yml, CREST-GAP-065)
        run: |
          id=$($WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).find(d=>d.name==="crestmont-staging");process.stdout.write(r?r.uuid:"")})')
          [ -n "$id" ] || { echo "::error::The crestmont-staging D1 database was not found."; exit 1; }
          node -e 'const fs=require("fs");let t=fs.readFileSync("wrangler.toml","utf8");t=t.replace(/(database_name = "crestmont-staging", database_id = )""/, `$1"${process.argv[1]}"`);fs.writeFileSync("wrangler.toml",t)' "$id"
          grep -q "$id" wrangler.toml && echo "Staging D1: $id"

      - name: Apply staging access (same epoch, no rotation, so the same derived passwords)
        env:
          MFA_ENCRYPTION_KEY: ${{ secrets.STAGING_MFA_ENCRYPTION_KEY }}
        run: node --no-warnings scripts/staging-access.ts --url "$STAGING_URL" --out access

      - name: Clean file and EICAR through the real portal, scanned by the operational scanner
        env:
          E2E_BASE_URL: ${{ vars.STAGING_URL || 'https://crestmont-platform-staging.partners-df4.workers.dev' }}
          E2E_ACCOUNTS_FILE: access/demo-accounts.md
          FILE_SCANNER_SECRET: ${{ secrets.FILE_SCANNER_SECRET }}
          E2E_REMOTE_SCANNER: "1"
          E2E_REMOTE_WAIT_SECONDS: "420"
        run: node --no-warnings scripts/scanner-staging-e2e.ts

      - name: Remove the credential files
        if: always()
        run: rm -f access/private.json access/access.json access/demo-accounts.md access/README.md
