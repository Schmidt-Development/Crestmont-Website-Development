name: Builder staging E2E (Junk in the Trunk)

# AI Website Builder certification on live staging (Founder directive 2026-11-01; scripts/builder-staging-e2e.ts).
#   stage=status    read-only: what staging records for the test customer, its project and build, and Node 1's polls.
#   stage=purchase  the real customer workflow: register → verify → Business checkout → Stripe TEST-mode payment →
#                   signed webhook → project → onboarding, which queues the build Node 1 must claim. Idempotent:
#                   a customer that already paid is never charged again.
# watch_minutes keeps polling the build (read-only) until it settles. Never deploys, never writes a secret, never
# writes D1, never touches production. Steps holding the Cloudflare token read D1 only; browser steps hold no secret.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "status / gallery (both read-only) or purchase (real staging checkout in Stripe test mode)"
        type: choice
        options: [status, purchase, gallery]
        default: status
      watch_minutes:
        description: "Keep polling the build for up to N minutes (0-330, read-only)"
        type: string
        default: "0"
      customer_email:
        description: "Re-certify a corrected brief as a fresh customer (a .test address; blank uses the fixture's)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: builder-staging-e2e
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'   # main only (see deploy-staging.yml)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: staging
    env:
      E2E_BASE_URL: ${{ vars.STAGING_URL || 'https://crestmont-platform-staging.partners-df4.workers.dev' }}
      # Read by scripts/builder-staging-e2e.ts, which refuses anything but a .test address. An env: assignment, not
      # an interpolation into a run: script (F-23).
      E2E_CUSTOMER_EMAIL: ${{ inputs.customer_email }}
      WRANGLER: npx --yes wrangler@4.149.0
      # Where Playwright keeps its Chromium. The install and the launch have to agree: tests/e2e/support.ts, which
      # the browser commands import, defaults this to /opt/pw-browsers when it is unset, and that is not where
      # "playwright install" writes -- so the launch went looking for a browser the install had put elsewhere.
      # deploy-staging.yml pins it per step; pinning it for the whole job means a browser step added later cannot
      # forget it, and the install step and every browser step resolve the same directory.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw/browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
      - name: Prepare (D1 read-only; derives the test customer's password, never printed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --no-warnings scripts/builder-staging-e2e.ts prepare --dir jitt
      - name: Install Playwright (no secrets)
        if: inputs.stage == 'purchase'
        env:
          PW: ${{ github.workspace }}/.pw/node_modules/playwright/index.mjs
        run: |
          npm install --prefix .pw --no-save --no-audit --no-fund --ignore-scripts playwright@1.48.2 > /dev/null
          .pw/node_modules/.bin/playwright install --with-deps chromium > /dev/null
          # Prove the browser the next steps will launch is installed, in the step that installed it. When the
          # install directory and the launch directory disagreed, the failure surfaced two steps later as
          # "Executable doesn't exist", which points at the browser step rather than at this one.
          node --input-type=module -e 'const { chromium } = await import(process.env.PW); const b = await chromium.launch(); await b.close(); console.log("chromium launches from " + process.env.PLAYWRIGHT_BROWSERS_PATH);'
      - name: Register the fictional customer (browser, no secrets)
        if: inputs.stage == 'purchase'
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.pw/node_modules/playwright/index.mjs
        run: node --no-warnings scripts/builder-staging-e2e.ts register --dir jitt
      - name: Read the verification link from the staging outbox (D1 read-only)
        if: inputs.stage == 'purchase'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --no-warnings scripts/builder-staging-e2e.ts verify-link --dir jitt
      - name: Purchase the Business package in Stripe test mode and submit onboarding (browser, no secrets)
        if: inputs.stage == 'purchase'
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.pw/node_modules/playwright/index.mjs
        run: node --no-warnings scripts/builder-staging-e2e.ts purchase --dir jitt
      - name: Design Gallery audit (D1 read-only)
        if: inputs.stage == 'gallery'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --no-warnings scripts/builder-staging-e2e.ts gallery --dir jitt
      # A database key is not an image. This HEADs the real R2 objects the audit listed, because a reference
      # whose bytes are missing can be selected, recorded and never reach a model -- which would look like
      # success in D1 and be a silent failure in the build.
      - name: Design Gallery image objects exist (R2, read-only)
        if: inputs.stage == 'gallery'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          f=evidence/jitt/gallery-keys.txt
          if [ ! -s "$f" ]; then echo "no image keys to probe"; exit 0; fi
          ok=0; missing=0
          while IFS= read -r k; do
            [ -z "$k" ] && continue
            if $WRANGLER r2 object get "crestmont-files-staging/$k" --remote --file /dev/null >/dev/null 2>&1; then
              ok=$((ok+1))
            else
              missing=$((missing+1)); echo "MISSING in R2: $k"
            fi
          done < "$f"
          echo "R2 objects present: $ok; missing: $missing"
          [ "$missing" -eq 0 ]
      - name: Certification status (D1 read-only)
        if: always() && inputs.stage != 'gallery'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WATCH_MINUTES: ${{ inputs.watch_minutes }}
        run: |
          case "$WATCH_MINUTES" in ''|*[!0-9]*) WATCH_MINUTES=0 ;; esac
          node --no-warnings scripts/builder-staging-e2e.ts status --dir jitt --wait-minutes "$WATCH_MINUTES"
      - name: Upload certification evidence (no credentials)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: builder-staging-e2e-evidence
          path: evidence/builder-staging-e2e.json
          if-no-files-found: ignore
          retention-days: 30
