name: Production readiness check (read-only)

# Founder actions F3 and F5 (2026-11-09). Answers, before the first production deploy, what can otherwise only be
# learned by deploying: which secrets and bindings the production Worker holds (NAMES and value hashes only, never
# values), whether the production D1 database and R2 bucket exist and match wrangler.toml, which backup settings exist,
# and whether the configured backup destination and seal passphrase actually work. For that last question it
# round-trips a small SEALED TEST OBJECT (no customer data) through the destination: seal, upload, download, check the
# sha256, open, delete.
#
# It changes nothing on production: no deploy, no migration, no secret written, no database write (D1 is only listed
# and asked for its table count). It needs the `production` environment's Cloudflare token, so the run waits for the
# Founder's approval when that environment has required reviewers. Manual only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-check
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ vars.BACKUP_ENVIRONMENT || 'production' }}
    env:
      WRANGLER: npx --yes wrangler@4.149.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"

      - name: Production Worker secrets (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          trap 'rm -f secrets.json names.txt' EXIT
          $WRANGLER secret list --env production --format json > secrets.json
          node --no-warnings scripts/provision-production.ts secret-names secrets.json > names.txt
          echo "### Production Worker secrets (names only)" >> "$GITHUB_STEP_SUMMARY"
          echo "$(tr '\n' ' ' < names.txt)" >> "$GITHUB_STEP_SUMMARY"
          missing=""
          for n in TURNSTILE_SITE_KEY TURNSTILE_SECRET EVIDENCE_INGEST_SECRET MFA_ENCRYPTION_KEY CRM_ERASURE_HMAC_KEY; do grep -qx "$n" names.txt || missing="$missing $n"; done
          if [ -n "$missing" ]; then echo "::error title=Required production secret missing::$missing"; else echo "::notice title=Required production secrets::all present (TURNSTILE_SITE_KEY, TURNSTILE_SECRET, EVIDENCE_INGEST_SECRET, MFA_ENCRYPTION_KEY, CRM_ERASURE_HMAC_KEY)"; fi
          founder=$(grep -xE 'STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|RESEND_API_KEY|RESEND_WEBHOOK_SECRET' names.txt | sort | paste -sd, - || true)
          [ -z "$founder" ] || echo "::notice title=Founder-managed activation secrets present::$founder (payments stay off until PAYMENTS_LIVE_AUTHORIZED = yes)"
          deferred=$(grep -xE 'RETELL_API_KEY|RETELL_OUTBOUND_API_KEY|ANTHROPIC_API_KEY|BUILD_RUNNER_SECRET|AI_BUILD_AUTOMATION|RESEARCH_RUNNER_SECRET|CRM_IMPORT_SECRET|PAYMENT_SIMULATION_ENABLED|STAGING_ACCESS_PASSWORD' names.txt | sort | paste -sd, - || true)
          [ -z "$deferred" ] || echo "::warning title=Phase-1 secret present::$deferred (voice, AI, simulation or preview; phase 1 never uses it)"
          [ -z "$missing" ]

      - name: Production Worker bindings and dashboard variables (names and value hashes only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The same guard the production deploy now runs before and after `wrangler deploy --keep-vars`. A Worker that
          # was never deployed reports no bindings (its D1 and R2 bindings are attached by the first deploy).
          node --no-warnings scripts/staging-binding-guard.ts snapshot --env production --out guard/now.json | tee -a "$GITHUB_STEP_SUMMARY"
          rm -rf guard

      - name: Production D1 and R2 exist and match wrangler.toml (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          want=$(node -e 'const t=require("fs").readFileSync("wrangler.toml","utf8");const b=t.slice(t.indexOf("[env.production]"));const m=/database_name = "crestmont-production", database_id = "([0-9a-f-]{36})"/.exec(b);process.stdout.write(m?m[1]:"")')
          got=$($WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).find(d=>d.name==="crestmont-production");process.stdout.write(r?r.uuid:"")})')
          if [ -n "$got" ] && [ "$got" = "$want" ]; then echo "::notice title=Production D1::crestmont-production exists and matches wrangler.toml"; else echo "::error title=Production D1::expected ${want:-<none in wrangler.toml>}, found ${got:-no database named crestmont-production}"; exit 1; fi
          tables=$($WRANGLER d1 execute crestmont-production --remote --env production --json --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%'" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s)[0].results[0].n)))')
          echo "Production D1 tables: $tables ($( [ "$tables" = "0" ] && echo 'empty: migrations 0001-0101 apply on the first deploy' || echo 'already migrated' ))" >> "$GITHUB_STEP_SUMMARY"
          if $WRANGLER r2 bucket list 2>/dev/null | grep -q "crestmont-files-production"; then echo "::notice title=Production R2::crestmont-files-production exists"; else echo "::error title=Production R2::crestmont-files-production not found"; exit 1; fi

      - name: Backup configuration present (names only)
        id: backup
        env:
          HAS_S3: ${{ secrets.BACKUP_S3_ENDPOINT != '' && secrets.BACKUP_S3_BUCKET != '' && secrets.BACKUP_S3_ACCESS_KEY_ID != '' && secrets.BACKUP_S3_SECRET_ACCESS_KEY != '' }}
          HAS_R2: ${{ vars.BACKUP_R2_BUCKET != '' }}
          HAS_SEAL: ${{ secrets.BACKUP_SEAL_PASSPHRASE != '' }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          {
            echo "### Backup and monitoring configuration"
            echo "- off-Cloudflare destination (BACKUP_S3_*): $HAS_S3"
            echo "- same-account R2 destination (BACKUP_R2_BUCKET): $HAS_R2"
            echo "- seal passphrase (BACKUP_SEAL_PASSPHRASE): $HAS_SEAL"
            echo "- PRODUCTION_URL: ${PRODUCTION_URL:-not set}"
          } >> "$GITHUB_STEP_SUMMARY"
          if { [ "$HAS_S3" = "true" ] || [ "$HAS_R2" = "true" ]; } && [ "$HAS_SEAL" = "true" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::warning title=Backup destination not configured::Set BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET, BACKUP_S3_ACCESS_KEY_ID, BACKUP_S3_SECRET_ACCESS_KEY and BACKUP_SEAL_PASSPHRASE on this environment (or the variable BACKUP_R2_BUCKET plus BACKUP_SEAL_PASSPHRASE). docs/BACKUP-RECOVERY.md §3.2."; echo "ready=false" >> "$GITHUB_OUTPUT"; fi

      - name: Backup destination round trip with a sealed test object (no customer data)
        if: steps.backup.outputs.ready == 'true'
        env:
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_R2_BUCKET: ${{ vars.BACKUP_R2_BUCKET }}
          ACCESS_ARTIFACT_PASSPHRASE: ${{ secrets.BACKUP_SEAL_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          work=$(mktemp -d); trap 'rm -rf "$work"' EXIT
          node --no-warnings scripts/seal.ts check
          node --no-warnings scripts/offsite-backup.ts check
          printf 'Crestmont production readiness check %s: test object, no customer data.\n' "${{ github.run_id }}" > "$work/test.txt"
          node --no-warnings scripts/seal.ts seal "$work/test.txt" "$work/test.sealed"
          key="crestmont-production/_readiness/${{ github.run_id }}.sealed"
          node --no-warnings scripts/offsite-backup.ts put "$work/test.sealed" "$key"
          node --no-warnings scripts/offsite-backup.ts get "$key" "$work/back.sealed"
          [ "$(sha256sum < "$work/test.sealed")" = "$(sha256sum < "$work/back.sealed")" ] || { echo "::error title=Backup round trip::the object read back differs from the one written"; exit 1; }
          node --no-warnings scripts/seal.ts open "$work/back.sealed" "$work/back.txt"
          cmp -s "$work/test.txt" "$work/back.txt" || { echo "::error title=Backup round trip::the opened object differs from the original"; exit 1; }
          node --no-warnings scripts/offsite-backup.ts delete "$key"
          echo "::notice title=Backup destination verified::sealed with BACKUP_SEAL_PASSPHRASE, uploaded, read back byte-identical, opened and deleted. This proves the destination and encryption; a production backup and restore are proven only by production-backup.yml after the first deploy."
          echo "- backup round trip: PASSED (seal → upload → download → sha256 → open → delete)" >> "$GITHUB_STEP_SUMMARY"

      - name: DNS and custom domain (read-only)
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler.toml attaches crestmontwebsitedevelopment.com to the production Worker as a custom domain. Cloudflare can
          # only do that when the zone is on this account and active (nameservers switched at the registrar) and the apex has
          # no conflicting CNAME. Otherwise `wrangler deploy` fails after the migrations have run. Nothing here changes DNS.
          host=$(node -e 'const t=require("fs").readFileSync("wrangler.toml","utf8");const b=t.slice(t.indexOf("[env.production]"));const m=/pattern = "([a-z0-9.-]+)", custom_domain = true/.exec(b);process.stdout.write(m?m[1]:"")')
          [ -n "$host" ] || { echo "::error title=Custom domain::no custom_domain route in [env.production]"; exit 1; }
          {
            echo "### DNS and custom domain: $host"
            echo '```'
            for t in NS SOA A AAAA CNAME; do printf '%-5s %s\n' "$t" "$(dig +short "$t" "$host" @1.1.1.1 | paste -sd' ' - || true)"; done
            printf '%-5s %s\n' "www" "$(dig +short A "www.$host" @1.1.1.1 | paste -sd' ' - || true)"
            printf '%-5s %s\n' "RCODE" "$(dig "$host" SOA @1.1.1.1 | sed -n 's/.*status: \([A-Z]*\).*/\1/p' | head -1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          api() { curl -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          zones=$(api "/zones?name=$host&account.id=$CLOUDFLARE_ACCOUNT_ID")
          verdict=$(printf '%s' "$zones" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let j;try{j=JSON.parse(s)}catch{return console.log("error|Cloudflare API did not answer with JSON")}
              if(!j.success)return console.log("noaccess|"+(j.errors||[]).map(e=>e.code+" "+e.message).join("; "));
              const z=(j.result||[])[0];if(!z)return console.log("missing|no zone named this on the account");
              console.log(z.status+"|"+z.id+"|"+(z.name_servers||[]).join(" ")+"|"+(z.original_name_servers||[]).join(" "))})')
          state=${verdict%%|*}
          case "$state" in
            active)
              zid=$(echo "$verdict" | cut -d'|' -f2)
              echo "- Cloudflare zone: active on this account (nameservers $(echo "$verdict" | cut -d'|' -f3))" >> "$GITHUB_STEP_SUMMARY"
              recs=$(api "/zones/$zid/dns_records?name=$host" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);if(!j.success)return console.log("unreadable");console.log((j.result||[]).map(r=>r.type+(r.proxied?"(proxied)":"")).join(",")||"none")}catch{console.log("unreadable")}})')
              echo "- apex DNS records: $recs (a CNAME here blocks the custom domain)" >> "$GITHUB_STEP_SUMMARY"
              doms=$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?hostname=$host" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);if(!j.success)return console.log("unreadable");console.log((j.result||[]).map(d=>d.hostname+" → "+d.service+" ("+d.environment+")").join(", ")||"none yet (the first deploy attaches it)")}catch{console.log("unreadable")}})')
              echo "- Worker custom domain: $doms" >> "$GITHUB_STEP_SUMMARY"
              wrecs=$(api "/zones/$zid/dns_records?name=www.$host" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);if(!j.success)return console.log("unreadable");console.log((j.result||[]).map(r=>r.type+(r.proxied?"(proxied)":"")+(r.meta&&r.meta.read_only?"(worker-managed)":"")).join(",")||"none")}catch{console.log("unreadable")}})')
              echo "- www DNS records: $wrecs (the deploy attaches www as a Worker custom domain; any other record must be removed first)" >> "$GITHUB_STEP_SUMMARY"
              if echo "$recs" | grep -q CNAME; then echo "::error title=Apex CNAME::$host has a CNAME record; remove it before the first deploy (docs/DEPLOYMENT.md §7)"; exit 1; fi
              if echo "$wrecs" | grep -Eq "CNAME|^A|,A|AAAA" && ! echo "$wrecs" | grep -q "worker-managed"; then echo "::warning title=www record exists::www.$host already has DNS records ($wrecs). Delete them in Cloudflare → DNS before deploying, so the deploy can attach www as a custom domain."; fi
              echo "::notice title=DNS::$host zone is active on this account; the first deploy can attach the custom domain" ;;
            pending)
              echo "::error title=DNS not active::the $host zone is on this Cloudflare account but PENDING: change the nameservers at the registrar to $(echo "$verdict" | cut -d'|' -f3) (currently $(echo "$verdict" | cut -d'|' -f4)). The production deploy cannot attach the domain until the zone is active."; exit 1 ;;
            missing)
              echo "::error title=DNS not on Cloudflare::$host is not a zone on this Cloudflare account. Add it (Cloudflare → Add a domain), then switch the nameservers at the registrar. The production deploy cannot attach the domain until then."; exit 1 ;;
            *)
              echo "::warning title=Zone not readable::the Cloudflare token could not list zones ($(echo "$verdict" | cut -d'|' -f2-)); the DNS answers above are the only evidence."
              dig +short NS "$host" @1.1.1.1 | grep -qi cloudflare || { echo "::error title=DNS::$host does not use Cloudflare nameservers"; exit 1; } ;;
          esac

      - name: Accounts and email delivery on production (counts only, read-only)
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Founder report (2026-11-09): /password/forgot said "Check your email" and nothing arrived. The page answers the same
          # whether or not an account exists (no account enumeration), so the question is answered here, from the database:
          # how many accounts and Owners production has, and what the mailer recorded. SELECTs only; no address, name, token
          # or message body is printed (error texts are shown with any address redacted).
          q() { $WRANGLER d1 execute crestmont-production --remote --env production --json --command "$1" 2>/dev/null; }
          {
            echo "### Accounts and email on production (counts only)"
            echo '```'
            q "SELECT (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM users WHERE disabled_at IS NULL) AS active_users, (SELECT COUNT(DISTINCT user_id) FROM memberships WHERE role_id = 'owner') AS owners, (SELECT COUNT(DISTINCT user_id) FROM memberships WHERE role_id NOT LIKE 'customer_%') AS staff, (SELECT COUNT(*) FROM invitations WHERE accepted_at IS NULL AND expires_at > strftime('%Y-%m-%dT%H:%M:%fZ','now')) AS open_invitations, (SELECT COUNT(*) FROM auth_tokens WHERE purpose = 'password_reset') AS reset_tokens, (SELECT COUNT(*) FROM security_events WHERE kind = 'password_reset_requested') AS reset_requests_for_existing_accounts, (SELECT COUNT(*) FROM email_suppressions WHERE removed_at IS NULL) AS suppressions" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s)[0].results[0];for(const[k,v]of Object.entries(r))console.log(k.padEnd(38)+v)}catch{console.log("could not read the account counts")}})'
            echo
            echo "email deliveries by template and status:"
            q "SELECT template, status, COUNT(*) AS n, MAX(created_at) AS latest, MAX(substr(COALESCE(last_error,''),1,160)) AS last_error FROM email_deliveries GROUP BY template, status ORDER BY latest DESC LIMIT 40" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s)[0].results;if(!r.length)console.log("  (none: the mailer has not recorded any email on production)");for(const x of r)console.log(`  ${x.template.padEnd(28)} ${String(x.status).padEnd(10)} ${String(x.n).padStart(4)}  latest ${x.latest}${x.last_error?"  error: "+x.last_error.replace(/[^\s@<>]+@[^\s@<>]+/g,"<address>"):""}`)}catch{console.log("could not read email_deliveries")}})'
            echo
            echo "Resend webhook events received (by type and outcome):"
            q "SELECT type, outcome, COUNT(*) AS n, MAX(received_at) AS latest FROM email_webhook_events GROUP BY type, outcome ORDER BY latest DESC LIMIT 20" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s)[0].results;if(!r.length)console.log("  (none: no signed Resend webhook has ever been accepted by production)");for(const x of r)console.log(`  ${x.type.padEnd(24)} ${x.outcome.padEnd(10)} ${String(x.n).padStart(4)}  latest ${x.latest}`)}catch{console.log("could not read email_webhook_events")}})'
            echo
            echo "unmatched webhook events (event time, Resend message id prefix, recipient domain, does any Crestmont email carry that id?):"
            q "SELECT e.type, e.event_created_at, e.received_at, substr(COALESCE(e.provider_message_id,''),1,8) AS mid, substr(COALESCE(e.recipient,''), instr(COALESCE(e.recipient,''),'@')+1) AS domain, EXISTS (SELECT 1 FROM email_deliveries d WHERE lower(d.provider_message_id) = lower(e.provider_message_id)) AS known FROM email_webhook_events e WHERE e.outcome = 'unmatched' ORDER BY e.received_at DESC LIMIT 15" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s)[0].results;if(!r.length)console.log("  (none)");for(const x of r)console.log(`  ${x.type.padEnd(24)} event ${x.event_created_at} received ${x.received_at} id ${x.mid||"(none)"}… to @${x.domain||"?"} known=${x.known?"yes":"no"}`)}catch{console.log("could not read unmatched events")}})'
            q "SELECT substr(COALESCE(provider_message_id,''),1,8) AS mid FROM email_deliveries WHERE template = 'staff_invitation' ORDER BY created_at DESC LIMIT 1" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s)[0].results[0];console.log(`  the Owner invitation was accepted by Resend as id ${r?r.mid:"?"}…`)}catch{}})'
            echo
            echo "latest emails (id, template, status, accepted by Resend, last update):"
            q "SELECT id, template, status, provider_message_id IS NOT NULL AS accepted, updated_at FROM email_deliveries ORDER BY created_at DESC LIMIT 5" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const x of JSON.parse(s)[0].results)console.log(`  ${x.id} ${x.template.padEnd(20)} ${String(x.status).padEnd(10)} accepted=${x.accepted?"yes":"no"} updated ${x.updated_at}`)}catch{console.log("could not read email_deliveries")}})'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stripe and Resend read-only probes on production (via a one-time database challenge)
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASE: ${{ vars.PRODUCTION_URL }}
        run: |
          # The same read-only checks as Owner → Integrations → Run check (src/services/integrations.ts): Stripe GET
          # /v1/balance, /v1/account, /v1/webhook_endpoints (and event destinations) with the live key — no charge, nothing
          # created — and Resend GET /domains. Production's ops secret is unknown to workflows, so a one-time challenge is
          # written with the production Cloudflare token (src/services/ops-challenge.ts). Keys and secrets are never printed.
          work=$(mktemp -d); trap 'rm -rf "$work"' EXIT
          node --no-warnings scripts/ops-challenge.ts --purpose integration_probe --out-sql "$work/c.sql" --out-nonce "$work/nonce"
          echo "::add-mask::$(cat "$work/nonce")"
          $WRANGLER d1 execute crestmont-production --remote --env production --file "$work/c.sql" --yes > /dev/null
          code=$(curl -s -o "$work/out.json" -w '%{http_code}' --max-time 60 -X POST -H 'content-type: application/json' --data "{\"challenge\":\"$(cat "$work/nonce")\"}" "$BASE/api/ops/integration-probe" || echo 000)
          {
            echo "### Provider probes on production (read-only)"
            if [ "$code" = "200" ]; then
              node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));for(const [k,v] of Object.entries(j))console.log(`- ${k}: ${v.status} — ${v.detail}`)' "$work/out.json"
            elif [ "$code" = "404" ]; then echo "- not available on the deployed Worker yet (needs the release with POST /api/ops/integration-probe)"
            else echo "- probe request answered HTTP $code"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
