<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vesper &amp; Rowe — Attorneys at Law</title>
<style>
  :root { --ink: #1a1f2b; --gold: #9a7b4f; --paper: #faf8f5; }
  body { margin: 0; font-family: Georgia, serif; color: var(--ink); background: var(--paper); }
  header { padding: 48px 32px; border-bottom: 3px solid var(--gold); }
  h1 { margin: 0; font-size: 38px; letter-spacing: 0.02em; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 32px; }
  form { display: grid; gap: 12px; max-width: 420px; }
  input, textarea { padding: 10px; border: 1px solid #ccc5b9; font: inherit; }
  button { padding: 12px 20px; background: var(--ink); color: var(--paper); border: 0; font: inherit; cursor: pointer; }
</style>
</head>
<body>
  <header><h1>Vesper &amp; Rowe</h1><p>Estate planning and probate, Lansing, Michigan.</p></header>
  <main>
    <h2>Request a consultation</h2>
    <form id="consult">
      <label>Name <input name="name" required></label>
      <label>Email <input name="email" type="email" required></label>
      <label>How can we help? <textarea name="matter" rows="4"></textarea></label>
      <button type="submit">Request consultation</button>
    </form>
  </main>
</body>
</html>
